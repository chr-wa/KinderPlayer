<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KinderPlayer</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif;touch-action:pan-y}body.detail{padding-top:0}#title{margin:0 0 16px;font-size:clamp(2rem,6vw,3.2rem);line-height:1.1}#categories{display:none;flex-wrap:wrap;gap:12px;margin:12px 0 18px}.category-bar{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}.category-tile{padding:10px 14px;border:1px solid #2d2d2d;border-radius:999px;background:#1e1e1e;color:#fff;cursor:pointer;font-size:1rem}.category-tile.active{background:#8ab4f8;color:#111;border-color:#8ab4f8}.nav{display:none;align-items:center;gap:12px;margin-bottom:16px}.back-btn,.btn-login,.player-button{border:none;border-radius:12px;cursor:pointer}.back-btn{display:inline-flex;align-items:center;gap:8px;background:#2b2b2b;color:#fff;padding:10px 14px}.btn-login{display:none;background:#1db954;color:#0d1117;padding:12px 18px;font-weight:700;font-size:1rem}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}.tile{position:relative;background:#1d1d1d;border:1px solid #2f2f2f;border-radius:16px;overflow:hidden;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}.tile:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(0,0,0,.25)}.tile.active{outline:2px solid #8ab4f8}.tile img{display:block;width:100%;aspect-ratio:1;height:auto;background:#2a2a2a;object-fit:cover}.tile-title{padding:10px 12px 12px;font-size:.95rem;line-height:1.25;word-break:break-word}.tile .restart-btn{position:absolute;top:10px;right:10px;border:none;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;padding:6px 8px;font-size:.7rem;cursor:pointer}.controls{display:none;position:fixed;left:0;right:0;bottom:0;padding:12px 16px 18px;background:rgba(16,16,16,.96);border-top:1px solid #2d2d2d;backdrop-filter:blur(8px)}.player-controls-inner{display:flex;align-items:center;justify-content:center;gap:12px}.player-button{width:50px;height:50px;background:#2b2b2b;color:#fff;display:flex;align-items:center;justify-content:center}.loading{display:block;margin:8px 0 20px;color:#d0d0d0;font-size:.95rem;min-height:1.2em}.empty{color:#bcbcbc;margin:0}
</style>
</head>
<body>
<h1 id="title">KinderPlayer</h1><button id="login" class="btn-login" style="display:none" type="button">Einmalig bei Spotify anmelden</button><div id="categories" class="category-bar" style="display:none"></div>
<div id="nav" class="nav"><button id="back" class="back-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>Zurück</button></div>
<div id="grid" class="grid"></div>
<div id="loading" class="loading" style="display:block">Prüfe Verbindung...</div>
<div id="controls" class="controls"><div class="player-controls-inner"><button id="previous" class="player-button" type="button" aria-label="Vorheriger Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg></button><button id="play-pause" class="player-button" type="button" aria-label="Wiedergabe"><svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg><svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button><button id="next" class="player-button" type="button" aria-label="Nächster Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45',REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/',CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}],$=id=>document.getElementById(id),token=()=>localStorage.getItem('access_token');let playlists=[],category=null,requestId=0,lastActive=null;
function loading(text){$('loading').textContent=text||'';$('loading').style.display=text?'block':'none'}function setDetail(v){$('nav').style.display=v?'block':'none';document.body.classList.toggle('detail',v);$('categories').classList.toggle('sticky',!v)}function showLogin(){loading('');$('login').style.display='block';$('categories').style.display='none';$('grid').innerHTML='';$('controls').style.display='none';setDetail(false);markActive(null)}async function api(path,options={}){const r=await fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}});if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Nicht autorisiert')}return r}function entry(item){return item?.track||item?.item||item?.episode||null}function cleanName(name){const p=CATEGORIES.find(c=>name.startsWith(c.prefix));return p?name.slice(p.prefix.length).trim():name}function makeTile(title,image,onClick,id,isPodcast=false){const t=document.createElement('div');t.className='tile';t.dataset.trackId=String(id||'');t.onclick=()=>onClick(false);const img=document.createElement('img');img.src=image||'';img.alt='';const label=document.createElement('div');label.className='tile-title';label.textContent=title;t.append(img,label);if(isPodcast){const b=document.createElement('button');b.type='button';b.className='restart-btn';b.textContent='↺ Von Anfang an';b.onclick=e=>{e.stopPropagation();onClick(true)};t.append(b)}return t}function renderCategories(){const box=$('categories');box.innerHTML='';CATEGORIES.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='category-tile'+(category===c.key?' active':'');b.textContent=c.label;b.onclick=()=>{category=category===c.key?null:c.key;renderCategories();renderPlaylists()};box.append(b)});box.style.display='flex'}function renderPlaylists(){const box=$('grid'),selected=CATEGORIES.find(c=>c.key===category),list=selected?playlists.filter(p=>p.name.startsWith(selected.prefix)):playlists;box.innerHTML='';if(!list.length){box.innerHTML='<p class="empty">Keine Playlists gefunden.</p>';loading('');return}list.forEach(p=>{const type=CATEGORIES.find(c=>p.name.startsWith(c.prefix));box.append(makeTile(cleanName(p.name),p.images?.[0]?.url,()=>loadPlaylist(p.id,cleanName(p.name),type?.key==='podcast'),p.id))});loading('');updatePlayer()}async function overview(){const id=++requestId;loading('Lade Playlists...');$('login').style.display='none';setDetail(false);$('title').textContent='KinderPlayer';category=null;try{const d=await(await api('/me/playlists?limit=50')).json();if(id!==requestId)return;playlists=(d.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(e){if(id===requestId){console.error(e);loading('Fehler beim Laden der Playlists.')}}}function markActive(id){const x=id==null?null:String(id);document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('active',x!==null&&t.dataset.trackId===x))}
function normalizeName(value){return String(value||'').toLowerCase().replace(/[^a-z0-9äöüß]/g,'')}
function collectPlaylistEpisodeRefs(items){const refs=[],seen=new Set();for(const raw of items){const e=entry(raw);if(!e)continue;const ref={id:String(e.id||raw?.id||'').trim(),uri:String(e.uri||raw?.uri||'').trim(),name:normalizeName(e.name||raw?.name||'')},key=ref.id?`id:${ref.id}`:ref.uri?`uri:${ref.uri}`:ref.name?`name:${ref.name}`:'';if(!key||seen.has(key))continue;seen.add(key);refs.push(ref)}return refs}
function minimumPlausibleEpisodeCount(playlistRefs){return playlistRefs.length<=1?1:playlistRefs.length>2?3:2}
function isShowEpisodeMatchPlausible(episodes,playlistRefs){if(!episodes.length)return false;const episodeIds=new Set(),episodeUris=new Set(),episodeNames=new Set();episodes.forEach(ep=>{const id=String(ep?.id||'').trim(),uri=String(ep?.uri||'').trim(),name=normalizeName(ep?.name||'');if(id){episodeIds.add(id);episodeUris.add(`spotify:episode:${id}`)}if(uri)episodeUris.add(uri);if(name)episodeNames.add(name)});const comparableCount=playlistRefs.length;if(!comparableCount)return episodes.length>1;let matched=0,strongMatched=0;playlistRefs.forEach(ref=>{if(ref.id&&episodeIds.has(ref.id)){matched++;strongMatched++;return}if(ref.uri&&episodeUris.has(ref.uri)){matched++;strongMatched++;return}if(!ref.id&&!ref.uri&&ref.name&&episodeNames.has(ref.name))matched++});if(comparableCount===1)return matched===1&&(!playlistRefs[0].id&&!playlistRefs[0].uri||strongMatched===1);if(matched<Math.min(2,comparableCount))return false;if(strongMatched===0&&playlistRefs.some(ref=>ref.id||ref.uri))return false;if(comparableCount>2&&episodes.length<3&&matched<comparableCount)return false;return true}
async function resolveShowIdFromPlaylist(items,title){const candidates=[],cleanTitle=String(title||'').replace(/^\[[^\]]+\]\s*/, '').trim();for(const raw of items){const e=entry(raw);if(!e)continue;const direct=e.show?.id||raw?.show?.id;if(direct&&!candidates.includes(direct))candidates.push(direct);const uri=String(e.uri||raw?.uri||'');const match=uri.match(/^spotify:show:([^:]+)/);if(match&&!candidates.includes(match[1]))candidates.push(match[1]);const episodeId=e.id||raw?.id;if(episodeId&&(e.type==='episode'||uri.startsWith('spotify:episode:'))){for(const endpoint of [`/episodes/${episodeId}?market=DE`,`/episodes/${episodeId}`]){try{const response=await api(endpoint);if(response.ok){const data=await response.json();if(data.show?.id&&!candidates.includes(data.show.id))candidates.push(data.show.id);break}}catch(error){console.warn('Episode-Show-Auflösung fehlgeschlagen:',endpoint,error)}}}}try{const query=encodeURIComponent(cleanTitle);const response=await api(`/search?q=${query}&type=show&limit=10&market=DE`);if(response.ok){const data=await response.json(),shows=data.shows?.items||[],wanted=normalizeName(cleanTitle);const exact=shows.find(show=>normalizeName(show.name)===wanted)||shows.find(show=>normalizeName(show.name).includes(wanted)||wanted.includes(normalizeName(show.name)));if(exact&&!candidates.includes(exact.id))candidates.push(exact.id)}}catch(error){console.warn('Show-Suche fehlgeschlagen:',error)}return candidates}
async function fetchShowEpisodes(showId,minEpisodeCount=1){let bestEpisodes=[];for(const initialUrl of [`/shows/${showId}/episodes?limit=50&market=DE`,`/shows/${showId}/episodes?limit=50`]){const episodes=[],seen=new Set();let url=initialUrl;try{while(url){const response=await api(url);if(!response.ok)throw Error(String(response.status));const data=await response.json();for(const item of data.items||[]){if(item?.id&&!seen.has(item.id)){seen.add(item.id);episodes.push(item)}}url=data.next?new URL(data.next).pathname+new URL(data.next).search:null}if(episodes.length>bestEpisodes.length)bestEpisodes=episodes}catch(error){console.warn('Show-Folgenabruf fehlgeschlagen:',initialUrl,error)}}return bestEpisodes}
function renderEpisodeTiles(episodes){const box=$('grid');box.innerHTML='';episodes.forEach(ep=>box.append(makeTile(ep.name,ep.images?.[0]?.url,restart=>playEpisode(ep,restart),ep.id,true)));loading('');$('controls').style.display='block';updatePlayer()}
async function loadPlaylist(id,title,isPodcast){const current=++requestId;loading('Lade Inhalte...');$('categories').style.display='none';setDetail(true);$('grid').innerHTML='';$('title').textContent=title;try{const response=await api(`/playlists/${id}/items?limit=100`);if(current!==requestId)return;if(!response.ok)throw Error('Playlist konnte nicht geladen werden');const items=(await response.json()).items||[];if(!items.length){loading('Keine Inhalte gefunden.');return}if(isPodcast||category==='podcast'){const playlistRefs=collectPlaylistEpisodeRefs(items),minEpisodeCount=minimumPlausibleEpisodeCount(playlistRefs),showIds=await resolveShowIdFromPlaylist(items,title);for(const showId of showIds){if(current!==requestId)return;const episodes=await fetchShowEpisodes(showId,minEpisodeCount);if(isShowEpisodeMatchPlausible(episodes,playlistRefs)){renderEpisodeTiles(episodes);return}}}let rendered=0;items.forEach(raw=>{const e=entry(raw);if(!e)return;rendered++;const image=e.album?.images?.[0]?.url||e.images?.[0]?.url||'';$('grid').append(makeTile(e.name,image,restart=>isPodcast?playEpisode(e,restart):playTrack(id,e),e.id,isPodcast))});if(!rendered){loading('Keine Inhalte gefunden.');return}loading('');$('controls').style.display='block';updatePlayer()}catch(error){if(current!==requestId)return;console.error(error);if(!$('grid').children.length)loading('Fehler beim Laden der Inhalte.');else loading('')}}
async function play(body){return fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(body)})}async function playTrack(pid,t){const r=await play({context_uri:`spotify:playlist:${pid}`,offset:{uri:`spotify:track:${t.id}`}});if(r.ok){lastActive={id:String(t.id),title:t.name};markActive(t.id);$('now').textContent=t.name;setTimeout(updatePlayer,500)}}async function playEpisode(e,restart){const b={uris:[`spotify:episode:${e.id}`]};if(restart)b.position_ms=0;const r=await play(b);if(r.ok){lastActive={id:String(e.id),title:e.name};markActive(e.id);$('now').textContent=e.name;setTimeout(updatePlayer,500)}}async function updatePlayer(){try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();$('controls').style.display='block';$('play-icon').style.display=d.is_playing?'none':'block';$('pause-icon').style.display=d.is_playing?'block':'none';const i=d.item,id=i?.id||i?.uri?.split(':').pop();if(id){lastActive={id:String(id),title:i.name||lastActive?.title};$('now').textContent=lastActive.title;markActive(id)}else if(lastActive){$('now').textContent=lastActive.title;markActive(lastActive.id)}}else if(!lastActive){markActive(null);$('now').textContent='Kein Titel aktiv'}}catch(error){if(lastActive){$('now').textContent=lastActive.title;markActive(lastActive.id)}}}async function control(action){await fetch('https://api.spotify.com/v1/me/player/'+action,{method:action==='next'||action==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+token()}});setTimeout(updatePlayer,500)}function randomString(length){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~',values=new Uint8Array(length);crypto.getRandomValues(values);return Array.from(values,value=>chars[value%chars.length]).join('')}async function login(){const verifier=randomString(128),digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)),challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',verifier);location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:challenge})}async function exchange(code){const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})}),data=await response.json();if(data.access_token){localStorage.setItem('access_token',data.access_token);history.replaceState({},document.title,location.pathname);overview()}else showLogin()}$('login').onclick=login;$('back').onclick=overview;$('previous').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('play-pause').onclick=async()=>{const response=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(response.status===200){const data=await response.json();control(data.is_playing?'pause':'play')}};(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!token())return showLogin();const response=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token()}});if(response.ok)overview();else showLogin()})();setInterval(updatePlayer,5000);
</script>
</body>
</html>

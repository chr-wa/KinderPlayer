<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"><title>Kinder Player</title><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif;overscroll-behavior:none;touch-action:pan-y}body.nav-visible{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold;cursor:pointer}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:0 auto 20px}.category-tile{background:#282828;color:#fff;border:3px solid transparent;border-radius:12px;padding:12px 18px;font-weight:bold;font-size:1rem;cursor:pointer;transition:.2s}.category-tile.active{border-color:#1db954;background:#333;transform:scale(1.03);box-shadow:0 4px 15px #1db95466}.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:3px solid transparent;transition:.2s}.tile.active{border-color:#1db954;background:#333;transform:scale(1.03);box-shadow:0 4px 15px #1db95466}.tile img{width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:none;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.podcast-episode .restart-btn{display:inline-block}.loading{text-align:center;color:#888;font-size:1.2rem;margin:40px 0}.player-controls{display:none;position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:100;background:#181818f2;backdrop-filter:blur(8px);padding:10px 20px;border-radius:30px;box-shadow:0 4px 16px #0008}.player-controls-inner{display:flex;align-items:center;justify-content:center;gap:20px}.player-button{background:none;border:0;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center}.player-button.primary{background:#1db954;width:48px;height:48px;border-radius:50%}.now-playing{text-align:center;color:#e5e5e5;font-size:.85rem;font-weight:600;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;margin-top:6px}.nav-bar{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:101;text-align:center}.back-btn{background:#282828;color:#fff;border:1px solid #ffffff26;padding:10px 22px;border-radius:25px;font-size:.95rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.empty-state{text-align:center;grid-column:1/-1}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f44;color:#fff;padding:12px 24px;border-radius:20px;font-weight:bold;display:none;z-index:200;max-width:90vw;text-align:center}@media(max-width:480px){body{padding:15px 15px 125px}body.nav-visible{padding-top:65px}h1{font-size:1.5rem}.grid-container{gap:12px}.category-tile{padding:10px 12px;font-size:.9rem}.player-controls{bottom:10px;width:calc(100% - 30px)}.nav-bar{top:10px;width:calc(100% - 30px)}.back-btn{width:100%}}
</style>
</head>
<body>
<h1 id="page-title">KinderPlayer</h1><button id="login-btn" class="btn-login" type="button" style="display:none">Einmalig bei Spotify anmelden</button><div id="category-bar" class="category-bar" style="display:none"></div><div id="loading" class="loading" style="display:none">Prüfe Verbindung...</div><div class="grid-container" id="kachel-grid"></div>
<div id="player-controls" class="player-controls"><div class="player-controls-inner"><button id="prev-btn" class="player-button" aria-label="Vorheriger Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button><button id="play-pause-btn" class="player-button primary" aria-label="Abspielen/Pausieren"><svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button><button id="next-btn" class="player-button" aria-label="Nächster Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div><div id="now-playing" class="now-playing">Kein Titel aktiv</div></div>
<div id="nav-bar" class="nav-bar"><button id="back-btn" class="back-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span>Zurück zur Übersicht</span></button></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45',REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/',CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];const ui={login:document.getElementById('login-btn'),loading:document.getElementById('loading'),grid:document.getElementById('kachel-grid'),title:document.getElementById('page-title'),categories:document.getElementById('category-bar'),controls:document.getElementById('player-controls'),nav:document.getElementById('nav-bar'),now:document.getElementById('now-playing'),play:document.getElementById('play-icon'),pause:document.getElementById('pause-icon')};let allPlaylists=[],selectedCategory=null,sequence=0;const token=()=>localStorage.getItem('access_token');const setLoading=(text,show=true)=>{ui.loading.textContent=text;ui.loading.style.display=show?'block':'none'};const spotify=(path,options={})=>fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}}).then(r=>{if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Unauthorized')}return r});function setBackNavVisible(v){ui.nav.style.display=v?'block':'none';document.body.classList.toggle('nav-visible',v)}function showLogin(){setLoading('',false);ui.login.style.display='block';ui.categories.style.display='none';ui.controls.style.display='none';setBackNavVisible(false)}function tile(title,image,onClick,trackId,isPodcast=false){const el=document.createElement('div');el.className='tile'+(isPodcast?' podcast-episode':'');if(trackId)el.dataset.trackId=trackId;el.onclick=onClick;el.innerHTML=`<img src="${image||''}" alt=""><div class="tile-title"></div>${isPodcast?'<button class="restart-btn" type="button">↺ Von Anfang an</button>':''}`;el.querySelector('.tile-title').textContent=title;if(isPodcast)el.querySelector('.restart-btn').onclick=e=>{e.stopPropagation();onClick(true)};return el}function renderCategories(){ui.categories.innerHTML='';CATEGORIES.forEach(c=>{const b=document.createElement('button');b.className='category-tile'+(selectedCategory===c.key?' active':'');b.type='button';b.textContent=c.label;b.setAttribute('aria-pressed',selectedCategory===c.key);b.onclick=()=>{selectedCategory=selectedCategory===c.key?null:c.key;renderCategories();renderPlaylists()};ui.categories.appendChild(b)});ui.categories.style.display='flex'}function renderPlaylists(){ui.grid.innerHTML='';const c=CATEGORIES.find(x=>x.key===selectedCategory),ps=c?allPlaylists.filter(p=>p.name.startsWith(c.prefix)):allPlaylists;if(!ps.length){ui.grid.innerHTML='<p class="empty-state">Keine Playlists für diese Auswahl gefunden.</p>';return}ps.forEach(p=>{const cp=CATEGORIES.find(c=>p.name.startsWith(c.prefix)),title=p.name.replace(cp?cp.prefix:'','').trim();ui.grid.appendChild(tile(title,p.images?.[0]?.url,()=>loadTracks(p.id,title)))});setLoading('',false);updatePlayer()}async function loadCategories(){setLoading('Lade Playlists...');ui.login.style.display='none';setBackNavVisible(false);ui.title.textContent='KinderPlayer';selectedCategory=null;try{const r=await spotify('/me/playlists?limit=50'),d=await r.json();allPlaylists=(d.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(e){console.error(e);setLoading('Fehler beim Laden der Playlists.')}}function entry(i){return i&&(i.track||i.item||i.episode)}async function showId(items){for(const i of items){const e=entry(i);if(!e)continue;if(e.show?.id)return e.show.id;const id=e.id||e.uri?.split(':')[2];if(e.type==='episode'&&id){const r=await spotify('/episodes/'+id);if(r.ok){const d=await r.json();if(d.show?.id)return d.show.id}}}return null}async function loadTracks(id,title){setLoading('Lade Titel...');ui.categories.style.display='none';setBackNavVisible(true);ui.grid.innerHTML='';ui.title.textContent=title;try{const r=await spotify(`/playlists/${id}/items?limit=100`);if(!r.ok)throw Error('Playlist konnte nicht geladen werden');const d=await r.json(),items=d.items||[];if(!items.length){setLoading('Keine Titel in dieser Playlist gefunden.');return}if(selectedCategory==='podcast'){const sid=await showId(items);if(sid){await loadPodcastEpisodes(sid,title);return}}setLoading('',false);items.forEach(i=>{const t=entry(i);if(t)ui.grid.appendChild(tile(t.name,t.album?.images?.[0]?.url||t.images?.[0]?.url,()=>playTrack(id,t),t.id))});updatePlayer()}catch(e){console.error(e);setLoading('Fehler beim Laden der Titel.')}}async function loadPodcastEpisodes(sid,title){try{setLoading('Lade Podcast-Folgen...');const r=await spotify(`/shows/${sid}/episodes?limit=50`);if(!r.ok)throw Error('Podcast-Folgen konnten nicht geladen werden');const d=await r.json(),eps=d.items||[];ui.grid.innerHTML='';if(!eps.length){setLoading('Keine Folgen für diesen Podcast gefunden.');return}eps.forEach(ep=>ui.grid.appendChild(tile(ep.name,ep.images?.[0]?.url||'',restart=>playEpisode(ep,restart),ep.id,true)));setLoading('',false);ui.controls.style.display='block';updatePlayer()}catch(e){console.error(e);setLoading('Fehler beim Laden der Podcast-Folgen.')}}async function playTrack(id,t){const r=await fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify({context_uri:`spotify:playlist:${id}`,offset:{uri:`spotify:track:${t.id}`}})});if(r.ok){ui.now.textContent=t.name;setTimeout(updatePlayer,500)}else if(r.status===404)notice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}async function playEpisode(ep,restart=false){const payload={uris:[`spotify:episode:${ep.id}`]};if(restart)payload.position_ms=0;const r=await fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok){ui.now.textContent=ep.name;setTimeout(updatePlayer,500)}else if(r.status===404)notice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}function notice(t){let n=document.getElementById('notice');if(!n){n=document.createElement('div');n.id='notice';n.className='notice';document.body.appendChild(n)}n.textContent=t;n.style.display='block'}function active(id){document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.trackId===id))}async function updatePlayer(){const n=++sequence;try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(n!==sequence)return;if(r.status===200){const d=await r.json();ui.controls.style.display='block';ui.play.style.display=d.is_playing?'none':'block';ui.pause.style.display=d.is_playing?'block':'none';if(d.item){active(d.item.id);ui.now.textContent=d.item.name}}else if(r.status===204){ui.play.style.display='block';ui.pause.style.display='none';ui.now.textContent='Kein Titel aktiv'}}catch(e){console.error(e)}}async function control(p){await fetch('https://api.spotify.com/v1/me/player/'+p,{method:p==='next'||p==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+token()}});setTimeout(updatePlayer,500)}function random(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return[...a].map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x%66]).join('')}async function login(){const v=random(128),d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)),c=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',v);location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative user-library-read user-library-modify,code_challenge_method:S256,code_challenge:c})}async function exchange(code){const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})}),d=await r.json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);loadCategories()}else showLogin()}ui.login.onclick=login;document.getElementById('back-btn').onclick=loadCategories;document.getElementById('prev-btn').onclick=()=>control('previous');document.getElementById('next-btn').onclick=()=>control('next');document.getElementById('play-pause-btn').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}else notice('Kein aktiver Player gefunden.')};(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!token())return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token()}});if(r.ok)loadCategories();else showLogin()})();setInterval(updatePlayer,5000);
</script>
</body></html>

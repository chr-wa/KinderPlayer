<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kinder Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif;touch-action:pan-y}body.detail{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold;cursor:pointer}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-bar.sticky{position:sticky;top:10px;z-index:9;background:#121212;padding:10px 0;border-radius:12px}.category-tile{background:#282828;color:#fff;border:3px solid transparent;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}.category-tile.active{border-color:#1db954;background:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.tile.active{border-color:#1db954!important;background:#333;transform:scale(1.03);box-shadow:0 4px 15px rgba(29,185,84,.4)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}@keyframes spin-once{from{transform:rotate(0)}to{transform:rotate(-360deg)}}.player-button.restart{position:absolute;left:22px;top:20px;transform:none;padding:8px;color:#b3b3b3}.player-button.restart svg{width:24px;height:24px}.player-button.restart svg.spin{animation:spin-once .6s ease}.player-button.restart:active{transform:scale(.92)}@media(max-width:360px){.player-button.restart{left:12px}}.loading{display:none;text-align:center;color:#888;font-size:1.1rem;margin:35px 0}.nav{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10;width:max-content;max-width:calc(100% - 30px)}.back-btn{background:#282828;color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 22px;border-radius:25px;font-size:.95rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.controls{position:relative;display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:20;background:rgba(24,24,24,.95);backdrop-filter:blur(8px);padding:12px 20px;border-radius:35px;box-shadow:0 4px 16px rgba(0,0,0,.25)}.player-controls-inner{display:flex;align-items:center;justify-content:center;gap:25px}.player-button{background:none;border:0;color:#fff;cursor:pointer;padding:10px;display:flex;align-items:center;justify-content:center}.player-button.primary{background:#1db954;width:64px;height:64px;border-radius:50%;padding:0}.now-playing{text-align:center;color:#e5e5e5;font-size:.85rem;font-weight:600;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;margin-top:6px}
.progress-row{display:flex;align-items:center;gap:10px;margin-top:6px;padding:0 6px}.time-label{font-size:.78rem;color:#b3b3b3;min-width:42px;text-align:center;font-variant-numeric:tabular-nums}#progress-bar{flex:1;-webkit-appearance:none;appearance:none;height:6px;background:#4d4d4d;border-radius:3px;outline:none;cursor:pointer}#progress-bar::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:#1db954;border:none;touch-action:none}#progress-bar::-moz-range-thumb{width:16px;height:16px;border-radius:50%;background:#1db954;border:none;touch-action:none}
  </style>
</head>
<body>
  <h1 id="title">KinderPlayer</h1>
  <button id="login" class="btn-login" type="button">Einmalig bei Spotify anmelden</button>
  <div id="categories" class="category-bar" style="display:none"></div>
  <div id="loading" class="loading"></div>
  <div id="grid" class="grid"></div>
  <div id="nav" class="nav">
    <button id="back" class="back-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <span>Zurück zur Übersicht</span>
    </button>
  </div>
  <div id="controls" class="controls">
    <button id="restart" class="player-button restart" type="button" aria-label="Von Anfang an">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><polyline points="3 4 3 9 8 9"/></svg>
    </button>
    <div class="player-controls-inner">
      <button id="previous" class="player-button" type="button" aria-label="Vorheriger Titel">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="toggle" class="player-button primary" type="button" aria-label="Abspielen/Pausieren">
        <svg id="play-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" width="32" height="32" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="next" class="player-button" type="button" aria-label="Nächster Titel">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div id="now" class="now-playing">Kein Titel aktiv</div>
    <div id="progress-row" class="progress-row">
      <span id="current-time" class="time-label">0:00</span>
      <input id="progress-bar" type="range" min="0" max="1000" value="0" step="1" aria-label="Fortschritt">
      <span id="total-time" class="time-label">0:00</span>
    </div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const CLIENT_ID = 'a6c7e7f802d043c29cce919b9e0c7f45', REDIRECT_URI = 'https://chr-wa.github.io/KinderPlayer/', CATEGORIES = [{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];
    const AUDIO_GROUPING_EMPTY_MESSAGE = 'Keine Hörspiele in dieser Playlist gefunden.';
    const OAUTH_SCOPE = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative user-read-playback-position';
    const REQUIRED_SCOPES = ['streaming', 'user-read-email', 'user-read-private', 'user-read-playback-state', 'user-modify-playback-state'];
    const $ = id => document.getElementById(id), token = () => localStorage.getItem('access_token');
    let playlists = [], category = null, requestId = 0, lastActive = null, webPlayer = null, webPlayerDeviceId = null, webPlayerReady = false, currentPlaybackMode = 'track';
let currentPodcastEpisodes = [], currentPodcastIndex = -1;
    // --- Progress / Media Session State ---
    let isDragging = false, dragCooldownUntil = 0;
    const episodeDurationCache = {};
    let currentTrackKey = null;
    let lastUserMarkId = null;           // Kachel-ID, die der User zuletzt gestartet hat
    let lastUserMarkGroup = null;        // Gruppen-Key, falls Horspiel-Gruppe
    const episodeGroupMap = new Map();   // episodeId -> group.key (Hoerspiel-Gruppen)
    const groupByKey = new Map();        // group.key -> group-Objekt (fuer Restart)
    let lastUserGroupObj = null;         // zuletzt per Klick gestartete Gruppe
    function isMarkSameGroup(candidateId) {
      // Erlaube Ueberschreiben nur wenn dieselbe User-Kachel aktiv ist (Gruppen-Nachfolger)
      if (!lastUserMarkId) return true;
      if (String(candidateId) === String(lastUserMarkId)) return true;
      // Hoerspiel-Gruppe: Nachfolger-Kapitel gehören zur gestarteten Kachel
      if (lastUserMarkGroup && episodeGroupMap.get(String(candidateId)) === lastUserMarkGroup) return true;
      return false;
    }
    function lockMarkFor(id, groupKey = null) {
      lastUserMarkId = id ? String(id) : null;
      lastUserMarkGroup = groupKey;
      markLockUntil = Date.now() + 8000;   // Schutzfenster bis SDK den neuen Track bestätigt
    }
    let lastProgress = { positionMs: 0, durationMs: 0, paused: true, updatedAt: 0 };
    
    function loading(text) { $('loading').textContent = text || ''; $('loading').style.display = text ? 'block' : 'none'; }
    function setDetail(v) { $('nav').style.display = v ? 'block' : 'none'; document.body.classList.toggle('detail', v); $('categories').classList.toggle('sticky', !v); }
    function resetWebPlayer() {
      if (webPlayer) {
        try { webPlayer.disconnect(); } catch (error) { console.warn('Web-Player Disconnect fehlgeschlagen:', error); }
      }
      webPlayer = null;
      webPlayerDeviceId = null;
      webPlayerReady = false;
      currentPlaybackMode = 'track';
    }
    function showLogin() { loading(''); $('login').style.display = 'block'; $('categories').style.display = 'none'; $('grid').innerHTML = ''; $('controls').style.display = 'none'; setDetail(false); markActive(null); resetWebPlayer(); }
    function clearAuth() { localStorage.removeItem('access_token'); localStorage.removeItem('refresh_token'); localStorage.removeItem('oauth_scopes'); resetWebPlayer(); }
    function hasRequiredScopes(scopeString) {
      if (!scopeString) return false;
      const scopes = new Set(scopeString.split(/\s+/).filter(Boolean));
      return REQUIRED_SCOPES.every(scope => scopes.has(scope));
    }
    function showNotice(message) {
      let notice = document.getElementById('player-notice');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'player-notice';
        notice.setAttribute('role', 'status');
        notice.setAttribute('aria-live', 'assertive');
        notice.style.cssText = 'position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:200;max-width:90vw;background:#ff4d4d;color:#fff;padding:12px 24px;border-radius:20px;font-weight:bold;box-shadow:0 8px 25px rgba(0,0,0,.25);text-align:center';
        document.body.appendChild(notice);
      }
      notice.textContent = message;
      notice.style.display = 'block';
    }
    function hideNotice() {
      const notice = document.getElementById('player-notice');
      if (notice) notice.style.display = 'none';
    }
    let markLockUntil = 0;
    function applyPlaybackState(isPlaying, item) {
      $('play-icon').style.display = isPlaying ? 'none' : 'block';
      $('pause-icon').style.display = isPlaying ? 'block' : 'none';
      if (item) {
        const uri = item?.uri || '';
        currentPlaybackMode = item?.type === 'episode' || uri.startsWith('spotify:episode:') ? 'podcast' : 'track';
      }
      const id = item?.id || item?.uri?.split(':').pop();
      if (id) {
        const newKey = String(id);
        if (newKey !== currentTrackKey) {
          currentTrackKey = newKey;
          lastProgress = { positionMs: 0, durationMs: 0, paused: !isPlaying, updatedAt: Date.now(), trackId: newKey };
        }
        lastActive = { id: String(id), title: item?.name || lastActive?.title || 'Kein Titel aktiv' };
        $('now').textContent = lastActive.title;
        if (Date.now() >= markLockUntil || isMarkSameGroup(String(id))) {
          // Gruppen-Nachfolger (Kapitel 2,3,...): die KACHEL der gestarteten Geschichte behalten
          if (lastUserMarkGroup && String(id) !== String(lastUserMarkId) && episodeGroupMap.get(String(id)) === lastUserMarkGroup) {
            markActive(lastUserMarkId);
          } else {
            markActive(id);
          }
        }
      } else if (lastActive) {
        $('now').textContent = lastActive.title;
        markActive(lastActive.id);
      } else {
        $('now').textContent = 'Kein Titel aktiv';
        markActive(null);
      }
    }
    async function api(path, options = {}) {
      const r = await fetch('https://api.spotify.com/v1' + path, { ...options, headers: { Authorization: 'Bearer ' + token(), ...(options.headers || {}) } });
      if (r.status === 401) { clearAuth(); showLogin(); throw Error('Nicht autorisiert'); }
      return r;
    }
    function entry(item) { return item?.track || item?.item || item?.episode || null; }
    function cleanName(name) { const p = CATEGORIES.find(c => name.startsWith(c.prefix)); return p ? name.slice(p.prefix.length).trim() : name; }
    function makeTile(title, image, onClick, id, isPodcast = false, description = '') {
      const t = document.createElement('div'); t.className = 'tile'; t.dataset.trackId = String(id || ''); t.onclick = () => onClick(false);
      const img = document.createElement('img'); img.src = image || ''; img.alt = '';
      const label = document.createElement('div'); label.className = 'tile-title'; label.textContent = title;
      t.append(img, label);
      if (description) {
        const desc = document.createElement('div');
        desc.style.cssText = 'margin-top:6px;color:#b3b3b3;font-size:.8rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden';
        desc.textContent = description;
        t.append(desc);
      }
      return t;
    }
    function normalizeEpisodeTitle(title) { return String(title || '').replace(/\s+/g, ' ').trim(); }
    function normalizeForKey(value) {
      return normalizeEpisodeTitle(value).toLocaleLowerCase('de-DE').replace(/[–—]/g, '-').replace(/\s+/g, ' ');
    }
    function removeFolgeMarkers(title) {
      return normalizeEpisodeTitle(title)
        .replace(/\(\s*folge\s*\d+[a-z]?\s*\)/gi, ' ')
        .replace(/\bfolge\s*\d+[a-z]?\b/gi, ' ')
        .replace(/\s+/g, ' ')
        .replace(/\s*[-–—:|]\s*$/g, '')
        .trim();
    }
    function normalizeStoryDisplayTitle(title) {
      return normalizeEpisodeTitle(title)
        .replace(/^(?:kapitel|teil)\s*0*\d+(?:\s*\/\s*0*\d+)?\s*[:\-–—]\s*/i, '')
        .replace(/\s*[:\-–—]\s*(?:kapitel|teil)\s*0*\d+(?:\s*\/\s*0*\d+)?\s*$/i, '')
        .trim();
    }
    function parseAudioEpisodeMeta(title) {
      const normalized = normalizeEpisodeTitle(title);
      if (!normalized) return null;

      const folgeMatch = normalized.match(/\bfolge\s*(\d+[a-z]?)\b/i);
      const folgeNumber = folgeMatch ? folgeMatch[1].toLocaleLowerCase('de-DE') : null;

      let working = normalized;
      let specialType = null;

      const summaryMatch = working.match(/^\s*inhaltsangabe\s*[:\-–—]\s*(.+)$/i);
      if (summaryMatch) {
        specialType = 'summary';
        working = normalizeEpisodeTitle(summaryMatch[1]);
      }

      let chapterNumber = null;
      let chapterTotal = null;

      const chapterPatterns = [
        { prefix: true, regex: /^(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s*[:\-–—]\s*(.+)$/i },
        { prefix: true, regex: /^(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s+(.+)$/i },
        { prefix: false, regex: /^(.+?)\s*[:\-–—]\s*(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s*$/i },
        { prefix: false, regex: /^(.+?)\s+(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s*$/i }
      ];

      for (const pattern of chapterPatterns) {
        const match = working.match(pattern.regex);
        if (!match) continue;
        if (pattern.prefix) {
          chapterNumber = Number(match[1]);
          chapterTotal = match[2] ? Number(match[2]) : null;
          working = normalizeEpisodeTitle(match[3]);
        } else {
          chapterNumber = Number(match[2]);
          chapterTotal = match[3] ? Number(match[3]) : null;
          working = normalizeEpisodeTitle(match[1]);
        }
        break;
      }

      const cleanedTitle = removeFolgeMarkers(working);
      const storyTitle = normalizeStoryDisplayTitle(cleanedTitle);
      const storyKey = normalizeForKey(cleanedTitle || working);

      return { normalized, folgeNumber, chapterNumber, chapterTotal, cleanedTitle, storyTitle, storyKey, specialType };
    }

    function groupChaptersByEpisode(items) {
      if (!items || !items.length) return [];

      const groupsMap = new Map();

      items.forEach((raw, index) => {
        const e = entry(raw) || raw;
        if (!e || !e.name) return;

        const meta = parseAudioEpisodeMeta(e.name);
        const albumOrShow = e.album?.name || e.show?.name || 'Hörspiel';
        
        let groupKey = '';
        let displayTitle = '';

        if (meta && meta.folgeNumber) {
          groupKey = `${normalizeForKey(albumOrShow)}::folge_${meta.folgeNumber}`;
          displayTitle = `${albumOrShow} - Folge ${meta.folgeNumber.toUpperCase()}${meta.storyTitle ? ': ' + meta.storyTitle : ''}`;
        } else if (meta && meta.storyKey) {
          groupKey = `${normalizeForKey(albumOrShow)}::${meta.storyKey}`;
          displayTitle = meta.storyTitle || meta.cleanedTitle || e.name;
        } else {
          groupKey = `${normalizeForKey(albumOrShow)}::${normalizeForKey(e.name)}`;
          displayTitle = e.name;
        }

        if (!groupsMap.has(groupKey)) {
          groupsMap.set(groupKey, {
            key: groupKey,
            title: displayTitle,
            episodes: []
          });
        }

        groupsMap.get(groupKey).episodes.push({
          episode: e,
          index: index,
          chapterNumber: meta?.chapterNumber ?? index + 1
        });
      });

      Array.from(groupsMap.values()).forEach(group => {
        group.episodes.forEach(eItem => { episodeGroupMap.set(String(eItem.episode?.id || ''), group.key); });
        groupByKey.set(group.key, group);
      });
      return Array.from(groupsMap.values()).map(group => {
        group.episodes.sort((a, b) => (a.chapterNumber - b.chapterNumber) || (a.index - b.index));
        return {
          key: group.key,
          title: group.title,
          episodes: group.episodes.map(item => item.episode)
        };
      });
    }

    function renderCategories() {
      const b = $('categories'); b.innerHTML = '';
      CATEGORIES.forEach(c => {
        const x = document.createElement('button'); x.type = 'button'; x.className = 'category-tile' + (category === c.key ? ' active' : '');
        x.textContent = c.label; x.onclick = () => { category = category === c.key ? null : c.key; renderCategories(); renderPlaylists(); }; b.append(x);
      });
      b.style.display = 'flex';
    }
    function renderPlaylists() {
      const b = $('grid'), c = CATEGORIES.find(x => x.key === category), list = c ? playlists.filter(p => p.name.startsWith(c.prefix)) : playlists;
      b.innerHTML = '';
      if (!list.length) {
        const empty = document.createElement('p');
        empty.textContent = 'Keine Playlists gefunden.';
        empty.style.cssText = 'text-align:center;width:100%;color:#888;grid-column:1/-1';
        b.append(empty);
        loading('');
        return;
      }
      list.forEach(p => {
        const type = CATEGORIES.find(x => p.name.startsWith(x.prefix));
        b.append(makeTile(cleanName(p.name), p.images?.[0]?.url, () => loadPlaylist(p.id, cleanName(p.name), type?.key), p.id));
      });
      loading(''); updatePlayer();
    }
    async function overview() {
      const id = ++requestId; loading('Lade Playlists...'); $('login').style.display = 'none'; setDetail(false);$('title').textContent = 'KinderPlayer';
      currentPlaybackMode = 'track';
      try {
        const d = await (await api('/me/playlists?limit=50')).json(); if (id !== requestId) return;
        playlists = (d.items || []).filter(p => p.name && CATEGORIES.some(c => p.name.startsWith(c.prefix)));
        renderCategories(); renderPlaylists();
      } catch (e) { if (id === requestId) { console.error(e); loading('Fehler beim Laden der Playlists.'); } }
    }
    function markActive(id) { const x = id == null ? null : String(id); document.querySelectorAll('.tile').forEach(t => t.classList.toggle('active', x !== null && t.dataset.trackId === x)); }


    async function fetchShowEpisodes(showId) {
      const episodes = [], seen = new Set();
      for (const url of [`/shows/${showId}/episodes?limit=50&market=DE`, `/shows/${showId}/episodes?limit=50`]) {
        let next = url;
        try {
          while (next) {
            const r = await api(next); if (!r.ok) throw Error(String(r.status));
            const d = await r.json(); (d.items || []).forEach(ep => { if (ep?.id && !seen.has(ep.id)) { seen.add(ep.id); episodes.push(ep); } });
            next = d.next ? d.next.replace('https://api.spotify.com/v1', '') : null;
          }
          if (episodes.length > 0) return episodes;
        } catch (err) { console.warn('Show-Folgenabruf:', url, err); }
      }
      return episodes;
    }

    async function resolveShowId(items, title) {
      for (const raw of items) {
        const e = entry(raw); if (!e) continue;
        const sid = e.show?.id || raw?.show?.id; if (sid) return sid;
      }
      const firstItem = items[0];
      if (firstItem) {
        try {
          const e = entry(firstItem); if (e) {
            const r = await api(`/episodes/${e.id}`); if (r.ok) {
              const d = await r.json(); if (d.show?.id) return d.show.id;
            }
          }
        } catch (err) { console.warn('Detail-Abfrage fehlgeschlagen', err); }
      }
      try {
        const query = encodeURIComponent(title);
        const response = await api(`/search?q=${query}&type=show&limit=1&market=DE`);
        if (response.ok) {
          const data = await response.json();
          const show = data.shows?.items?.[0]; if (show) return show.id;
        }
      } catch (e) { console.warn('Namenssuche fehlgeschlagen', e); }
      return null;
    }

async function enqueueEpisode(episodeId) {
      const uri = `spotify:episode:${episodeId}`;
      let queueUrl = `https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(uri)}`;
      if (webPlayerDeviceId) queueUrl += `&device_id=${encodeURIComponent(webPlayerDeviceId)}`;
      
      let response = await fetch(queueUrl, { method: 'POST', headers: { Authorization: 'Bearer ' + token() } });
      
      // Fallback: Wenn der Aufruf fehlschlägt (z.B. 404 oder 429), einmalig 600ms warten und erneut versuchen
      if (!response.ok && response.status !== 401) {
        await new Promise(r => setTimeout(r, 600));
        response = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(uri)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + token() } });
      }
      
      if (response.status === 401) {
        clearAuth();
        showLogin();
      }
      return response;
    }

async function playEpisodeGroup(group, playlistId, restart) {
      const episodes = group?.episodes || [];
      if (!episodes.length) {
        showNotice('Fehler: Keine Kapitel in dieser Folge gefunden.');
        return;
      }

      const firstEpisode = episodes[0];
      if (!firstEpisode || !firstEpisode.id) {
        showNotice('Fehler: Kapitel-ID ungültig.');
        return;
      }

      // 1. Sofortiges UI Feedback
      lastUserGroupObj = group;
      lastActive = { id: String(firstEpisode.id), title: group.title || firstEpisode.name };
      $('now').textContent = lastActive.title;

    $('login').onclick = login; $('back').onclick = overview; $('previous').onclick = () => control('previous'); $('next').onclick = () => control('next');
    $('restart').onclick = async () => {
      const svg = $('restart').querySelector('svg'); if (svg) { svg.classList.add('spin'); setTimeout(() => svg.classList.remove('spin'), 650); }
      // 1) Hörspiel-Gruppe: die GANZE Geschichte von Kapitel 1 neu (mit Queue)
      if (lastUserGroupObj?.episodes?.length) {
        try { await playEpisodeGroup(lastUserGroupObj, null, true); } catch (e) { console.error('Restart Gruppe:', e); showNotice('Neustart fehlgeschlagen.'); }
        hideNotice(); return;
      }
      // 2) Podcast: laufende Episode aus Show-Liste neu starten
      if (currentPodcastEpisodes.length && currentPodcastIndex !== -1) { await playEpisode(currentPodcastEpisodes[currentPodcastIndex], true, currentPodcastIndex); hideNotice(); return; }
      // 3) Laufenden Titel ermitteln und neu starten
      let item = null;
      try {
        const r = await fetch('https://api.spotify.com/v1/me/player', { headers: { Authorization: 'Bearer ' + token() } });
        if (r.ok) item = (await r.json())?.item || null;
      } catch (e) { console.warn('Restart: Player-State nicht abrufbar:', e); }
      if (!item?.id && lastActive?.id) {
        item = currentPodcastEpisodes.find(x => String(x.id) === String(lastActive.id)) || null;
        if (!item) { item = { id: lastActive.id, name: lastActive.title, type: 'episode', uri: 'spotify:episode:' + lastActive.id }; }
      }
      if (!item?.id) { showNotice('Kein laufender Titel. Bitte zuerst eine Kachel starten.'); return; }
      const isEpisode = item.type === 'episode' || String(item.uri || '').startsWith('spotify:episode:');
      if (isEpisode) { await playEpisode(item, true); }
      else {
        const t = { id: item.id, name: item.name };
        const pid = (playlists.find(p => t.name && p.tracks?.items?.some?.(x => x.track?.id === t.id)) || {}).id;
        if (pid) await playTrack(pid, t); else await play({ uris: ['spotify:track:' + t.id], position_ms: 0 });
      }
      hideNotice();
    };$('toggle').onclick = async () => {
      try {
        const r = await fetch('https://api.spotify.com/v1/me/player', { headers: { Authorization: 'Bearer ' + token() } });
        if (r.status === 200) {
          const d = await r.json();
          if (webPlayer && webPlayerReady && d.device?.id === webPlayerDeviceId) {
            try {
              await webPlayer.togglePlay();
              hideNotice();
              setTimeout(updatePlayer, 500);
              return;
            } catch (error) {
              console.warn('SDK Toggle fehlgeschlagen, nutze Fallback:', error);
            }
          }
          await control(d.is_playing ? 'pause' : 'play');
        } else if (r.status === 204) {
          showNotice('Kein aktiver Titel. Bitte einen Titel über eine Kachel starten.');
        } else if (r.status === 404) {
          showNotice('Kein aktiver Player gefunden. Bitte zuerst einen Titel starten.');
        } else if (r.status === 401) {
          showNotice('Token ungültig. Bitte erneut anmelden.');
          clearAuth();
          showLogin();
        } else {
          showNotice('Player-Status konnte nicht geladen werden.');
        }
      } catch (error) {
        console.error('Fehler beim Umschalten von Play/Pause:', error);
        showNotice('Play/Pause konnte nicht ausgeführt werden.');
      }
    };
(async () => {
      try {
        const params = new URLSearchParams(location.search);
        const authError = params.get('error');
        if (authError) {
          history.replaceState({}, document.title, location.pathname);
          showNotice('Spotify-Autorisierung fehlgeschlagen. Bitte erneut anmelden.');
          showLogin();
          return;
        }

        const code = params.get('code'); 
        if (code) return exchange(code);

        const t = localStorage.getItem('access_token'); 
        if (!t) {
          showLogin();
          return;
        }

        const storedScopes = localStorage.getItem('oauth_scopes');
        if (storedScopes && !hasRequiredScopes(storedScopes)) {
          clearAuth();
          showNotice('Neue Berechtigungen erforderlich. Bitte erneut bei Spotify anmelden.');
          showLogin();
          return;
        }

        const r = await fetch('https://api.spotify.com/v1/me', { headers: { Authorization: 'Bearer ' + t } });
        if (r.ok) { 
          $('login').style.display = 'none';
          initWebPlayer(); 
          overview(); 
        } else { 
          clearAuth(); 
          showLogin(); 
        }
      } catch (error) {
        console.error('Initialisierung fehlgeschlagen:', error);
        showLogin();
      }
    })();
    setInterval(updatePlayer, 5000);
  </script>
</body>

<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KinderPlayer</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif;touch-action:pan-y}body.detail{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold;cursor:pointer}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-bar.sticky{position:sticky;top:10px;z-index:9;background:#121212;padding:10px 0;border-radius:12px}.category-tile{background:#282828;color:#fff;border:3px solid transparent;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}.category-tile.active{border-color:#1db954;background:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.tile.active{border-color:#1db954!important;background:#333;transform:scale(1.03);box-shadow:0 4px 15px rgba(29,185,84,.4)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:block;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.loading{display:none;text-align:center;color:#888;font-size:1.1rem;margin:35px 0}.nav{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10;width:max-content;max-width:calc(100% - 30px)}.back-btn{background:#282828;color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 22px;border-radius:25px;font-size:.95rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.controls{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:20;background:rgba(24,24,24,.95);backdrop-filter:blur(8px);padding:10px 20px;border-radius:30px;box-shadow:0 4px 16px rgba(0,0,0,.25)}.player-controls-inner{display:flex;align-items:center;justify-content:center;gap:20px}.player-button{background:none;border:0;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center}.player-button.primary{background:#1db954;width:48px;height:48px;border-radius:50%}.now-playing{text-align:center;color:#e5e5e5;font-size:.85rem;font-weight:600;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;margin-top:6px}.empty{text-align:center;grid-column:1/-1}@media(max-width:480px){body{padding:15px 15px 125px}body.detail{padding-top:65px}.category-tile{padding:10px 12px;font-size:.9rem}.nav{top:10px;width:calc(100% - 30px)}.back-btn{width:100%}}
</style>
</head>
<body>
<h1 id="title">KinderPlayer</h1><button id="login" class="btn-login" style="display:none" type="button">Einmalig bei Spotify anmelden</button><div id="categories" class="category-bar" style="display:none"></div><div id="loading" class="loading"></div><div id="grid" class="grid"></div>
<div id="nav" class="nav"><button id="back" class="back-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span>Zurück zur Übersicht</span></button></div>
<div id="controls" class="controls"><div class="player-controls-inner"><button id="previous" class="player-button" type="button" aria-label="Vorheriger Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button><button id="toggle" class="player-button primary" type="button" aria-label="Abspielen/Pausieren"><svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button><button id="next" class="player-button" type="button" aria-label="Nächster Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div><div id="now" class="now-playing">Kein Titel aktiv</div></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45',REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/',CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];const $=id=>document.getElementById(id),token=()=>localStorage.getItem('access_token');let playlists=[],category=null,requestId=0,lastActive=null;
function loading(text){$('loading').textContent=text\vert{}\vert{}'';$('loading').style.display=text?'block':'none'}function setDetail(v){$('nav').style.display=v?'block':'none';document.body.classList.toggle('detail',v);$('categories').classList.toggle('sticky',!v)}function showLogin(){loading('');$('login').style.display='block';$('categories').style.display='none';$('grid').innerHTML='';$('controls').style.display='none';setDetail(false);markActive(null)}async function api(path,options={}){const r=await fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}});if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Nicht autorisiert')}return r}function entry(item){return item?.track||item?.item||item?.episode||null}function cleanName(name){const p=CATEGORIES.find(c=>name.startsWith(c.prefix));return p?name.slice(p.prefix.length).trim():name}function makeTile(title,image,onClick,id,isPodcast=false){const t=document.createElement('div');t.className='tile';t.dataset.trackId=String(id||'');t.onclick=()=>onClick(false);const img=document.createElement('img');img.src=image||'';img.alt='';const label=document.createElement('div');label.className='tile-title';label.textContent=title;t.append(img,label);if(isPodcast){const b=document.createElement('button');b.type='button';b.className='restart-btn';b.textContent='↺ Von Anfang an';b.onclick=e=>{e.stopPropagation();onClick(true)};t.append(b)}return t}function renderCategories(){const b=$('categories');b.innerHTML='';CATEGORIES.forEach(c=>{const x=document.createElement('button');x.type='button';x.className='category-tile'+(category===c.key?' active':'');x.textContent=c.label;x.onclick=()=>{category=category===c.key?null:c.key;renderCategories();renderPlaylists()};b.append(x)});b.style.display='flex'}function renderPlaylists(){const b=$('grid'),c=CATEGORIES.find(x=>x.key===category),list=c?playlists.filter(p=>p.name.startsWith(c.prefix)):playlists;b.innerHTML='';if(!list.length){b.innerHTML='<p class="empty">Keine Playlists gefunden.</p>';loading('');return}list.forEach(p=>{const type=CATEGORIES.find(x=>p.name.startsWith(x.prefix));b.append(makeTile(cleanName(p.name),p.images?.[0]?.url,()=>loadPlaylistTracks(token(),p.id,cleanName(p.name)),p.id))});loading('');updatePlayer()}async function overview(){const id=++requestId;loading('Lade Playlists...');$('login').style.display='none';setDetail(false);$('title').textContent='KinderPlayer';category=null;try{const d=await(await api('/me/playlists?limit=50')).json();if(id!==requestId)return;playlists=(d.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(e){if(id===requestId){console.error(e);loading('Fehler beim Laden der Playlists.')}}}function markActive(id){const x=id==null?null:String(id);document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('active',x!==null&&t.dataset.trackId===x))}

async function resolveShowIdFromPlaylist(items) {
  for (const raw of items) {
    const e = raw?.track || raw?.item || raw?.episode;
    if (!e) continue;

    const direct = e.show?.id || raw?.show?.id;
    if (direct) return direct;

    const uri = String(e.uri || raw?.uri || '');
    const showMatch = uri.match(/^spotify:show:([^:]+)/);
    if (showMatch) return showMatch[1];

    const episodeId = e.id || raw?.id;
    if (episodeId && (e.type === 'episode' || uri.startsWith('spotify:episode:'))) {
      try {
        const res = await api(`/episodes/${episodeId}?market=DE`);
        if (res.ok) {
          const data = await res.json();
          if (data.show?.id) return data.show.id;
        }
      } catch (err) {
        console.warn('Episode show lookup failed', err);
      }
    }
  }
  return null;
}

async function fetchShowEpisodes(showId) {
  const episodes = [];
  let url = `/shows/${showId}/episodes?limit=50&market=DE`;

  while (url) {
    const res = await api(url);
    if (!res.ok) throw new Error(`Show episodes failed: ${res.status}`);

    const data = await res.json();
    (data.items || []).forEach(item => item && episodes.push(item));

    url = data.next
      ? new URL(data.next).pathname + new URL(data.next).search
      : null;
  }

  return episodes;
}

function renderEpisodeTiles(episodes) {
  const box = document.getElementById('grid');
  box.innerHTML = '';

  episodes.forEach(ep => {
    const image = ep.images?.[0]?.url || '';
    const title = ep.name || 'Unbekannte Folge';

    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.dataset.trackId = String(ep.id || '');
    tile.onclick = () => playEpisode(ep, false);

    tile.innerHTML = `
      <img src="${image}" alt="${title}">
      <div class="tile-title">${title}</div>
    `;

    const restartBtn = document.createElement('button');
    restartBtn.type = 'button';
    restartBtn.className = 'restart-btn';
    restartBtn.textContent = '↺ Von Anfang an';
    restartBtn.onclick = (e) => {
      e.stopPropagation();
      playEpisode(ep, true);
    };
    tile.appendChild(restartBtn);

    box.appendChild(tile);
  });

  document.getElementById('controls').style.display = 'block';
  updatePlayer();
}

async function loadPlaylistTracks(tok, playlistId, title) {
  const current = ++requestId;
  loading('Lade Inhalte...');
  $('categories').style.display = 'none';
  setDetail(true);
  document.getElementById('grid').innerHTML = '';
  document.getElementById('title').textContent = title;

  try {
    const res = await api(`/playlists/${playlistId}/items?limit=100`);
    if (current !== requestId) return;
    if (!res.ok) throw new Error(`Playlist load failed: ${res.status}`);

    const data = await res.json();
    const items = data.items || [];

    if (!items.length) {
      loading('Keine Inhalte gefunden.');
      return;
    }

    const showId = await resolveShowIdFromPlaylist(items);
    if (current !== requestId) return;

    if (showId) {
      try {
        const episodes = await fetchShowEpisodes(showId);
        if (current !== requestId) return;
        if (episodes.length) {
          loading('');
          renderEpisodeTiles(episodes);
          return;
        }
      } catch (err) {
        console.warn('Show load failed, fell back to playlist items', err);
      }
    }

    // Fallback
    items.forEach(item => {
      const track = item.track || item.item || item.episode;
      if (!track) return;

      const image = track.album?.images?.[0]?.url || track.images?.[0]?.url || '';
      const tile = makeTile(track.name, image, (restart) => {
        if (track.type === 'episode' || track.uri?.includes(':episode:')) {
          playEpisode(track, restart);
        } else {
          playTrack(playlistId, track);
        }
      }, track.id, track.type === 'episode' || track.uri?.includes(':episode:'));
      
      document.getElementById('grid').appendChild(tile);
    });

    if (current !== requestId) return;
    loading('');
    document.getElementById('controls').style.display = 'block';
    updatePlayer();

  } catch (err) {
    if (current !== requestId) return;
    console.error('Netzwerkfehler:', err);
    loading('Fehler beim Laden der Inhalte.');
  }
}

async function play(body){return fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(body)})}async function playTrack(pid,t){const r=await play({context_uri:`spotify:playlist:${pid}`,offset:{uri:`spotify:track:${t.id}`}});if(r.ok){lastActive={id:String(t.id),title:t.name};markActive(t.id);$('now').textContent=t.name;setTimeout(updatePlayer,500)}}async function playEpisode(e,restart){const b={uris:[`spotify:episode:${e.id}`]};if(restart)b.position_ms=0;const r=await play(b);if(r.ok){lastActive={id:String(e.id),title:e.name};markActive(e.id);$('now').textContent=e.name;setTimeout(updatePlayer,500)}}async function updatePlayer(){try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();$('controls').style.display='block';$('play-icon').style.display=d.is_playing?'none':'block';$('pause-icon').style.display=d.is_playing?'block':'none';const i=d.item,id=i?.id||i?.uri?.split(':').pop();if(id){lastActive={id:String(id),title:i.name||lastActive?.title};$('now').textContent=lastActive.title;markActive(id)}else if(lastActive){$('now').textContent=lastActive.title;markActive(lastActive.id)}}else if(!lastActive){markActive(null);$('now').textContent='Kein Titel aktiv'}}catch(e){if(lastActive){$('now').textContent=lastActive.title;markActive(lastActive.id)}}}async function control(a){await fetch('https://api.spotify.com/v1/me/player/'+a,{method:a==='next'||a==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+token()}});setTimeout(updatePlayer,500)}function random(n){const c='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~',a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>c[x%c.length]).join('')}async function login(){const v=random(128),d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)),c=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',v);location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:c})}async function exchange(code){const d=await(await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})})).json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);overview()}else showLogin()}$('login').onclick=login;$('back').onclick=overview;$('previous').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('toggle').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}};(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!token())return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token()}});if(r.ok)overview();else showLogin()})();setInterval(updatePlayer,5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kinder Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: #121212;
      color: #fff;
      font-family: sans-serif;
      overscroll-behavior: none;
      touch-action: pan-y;
    }

    h1 {
      text-align: center;
      color: #1db954;
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .btn-login {
      display: block;
      margin: 50px auto;
      padding: 15px 30px;
      background: #1db954;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }

    .tile {
      background: #282828;
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tile.active {
      border-color: #1db954;
      background: #333333;
      transform: scale(1.03);
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
    }

    .tile img {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
    }

    .tile-title {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .loading {
      text-align: center;
      color: #888;
      font-size: 1.2rem;
      margin-top: 40px;
    }

    .player-controls {
      display: none;
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(24, 24, 24, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      margin: 0 auto 20px auto;
      max-width: 500px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    }

    .player-controls-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
    }

    .player-button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .player-button.primary {
      background: #1DB954;
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .now-playing {
      text-align: center;
      color: #e5e5e5;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 1.2em;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
      margin-top: 6px;
    }

    .nav-bar {
      display: none;
      text-align: center;
      margin: 15px 0 25px 0;
    }

    .back-btn {
      background: #282828;
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .app-version {
      text-align: center;
      color: #555;
      font-size: 0.8rem;
      margin: 30px 0 10px 0;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
    }

    .notice {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #ff4d4d;
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      max-width: 90vw;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .grid-container {
        gap: 12px;
      }
    }
  </style>
</head>
<body>

  <div id="player-controls" class="player-controls">
    <div class="player-controls-inner">
      <button id="prev-btn" class="player-button" aria-label="Vorheriger Titel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <button id="play-pause-btn" class="player-button primary" aria-label="Abspielen/Pausieren">
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <button id="next-btn" class="player-button" aria-label="Nächster Titel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <div id="now-playing" class="now-playing">Kein Titel aktiv</div>
  </div>

  <div id="nav-bar" class="nav-bar">
    <button id="back-to-main-btn" class="back-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Zurück zur Übersicht
    </button>
  </div>

  <h1 id="page-title">KinderPlayer</h1>

  <button id="login-btn" class="btn-login" type="button" style="display:none;">
    Einmalig bei Spotify anmelden
  </button>

  <div id="loading" class="loading">Prüfe Verbindung...</div>

  <div class="grid-container" id="kachel-grid"></div>

  <div id="app-version" class="app-version"></div>

  <script>
    const CLIENT_ID = 'a6c7e7f802d043c29cce919b9e0c7f45';
    const REDIRECT_URI = 'https://chr-wa.github.io/KinderPlayer/';
    const PREFIX = "[KID]";

    const ui = {
      loginBtn: document.getElementById('login-btn'),
      loading: document.getElementById('loading'),
      grid: document.getElementById('kachel-grid'),
      pageTitle: document.getElementById('page-title'),
      navBar: document.getElementById('nav-bar'),
      playerControls: document.getElementById('player-controls'),
      appVersion: document.getElementById('app-version'),
      playPauseBtn: document.getElementById('play-pause-btn'),
      prevBtn: document.getElementById('prev-btn'),
      nextBtn: document.getElementById('next-btn'),
      backToMainBtn: document.getElementById('back-to-main-btn'),
      playIcon: document.getElementById('play-icon'),
      pauseIcon: document.getElementById('pause-icon'),
      nowPlaying: document.getElementById('now-playing')
    };

    let updateSequence = 0;

    function setLoading(message, visible = true) {
      ui.loading.textContent = message;
      ui.loading.style.display = visible ? 'block' : 'none';
    }

    function setPageTitle(title) {
      ui.pageTitle.textContent = title;
    }

    function setNowPlayingText(title) {
      if (!ui.nowPlaying) return;
      ui.nowPlaying.textContent = title || 'Kein Titel aktiv';
    }

    function showLogin() {
      ui.loading.style.display = 'none';
      ui.loginBtn.style.display = 'block';
      ui.playerControls.style.display = 'none';
      ui.navBar.style.display = 'none';
      setNowPlayingText('Kein Titel aktiv');
    }

    function showNotice(message) {
      let notice = document.getElementById('player-notice');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'player-notice';
        notice.className = 'notice';
        document.body.appendChild(notice);
      }
      notice.textContent = message;
      notice.style.display = 'block';
    }

    function hideNotice() {
      const notice = document.getElementById('player-notice');
      if (notice) notice.style.display = 'none';
    }

    function setPlayPauseIcon(isPlaying) {
      if (!ui.playIcon || !ui.pauseIcon) return;
      ui.playIcon.style.display = isPlaying ? 'none' : 'block';
      ui.pauseIcon.style.display = isPlaying ? 'block' : 'none';
    }

    function createTile({ title, imageUrl = '', trackId = null, onClick }) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      if (trackId) tile.dataset.trackId = trackId;

      tile.onclick = onClick;

      tile.innerHTML = `
        <img src="${imageUrl || ''}" alt="${title}">
        <div class="tile-title">${title}</div>
      `;

      return tile;
    }

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const values = new Uint8Array(length);
      window.crypto.getRandomValues(values);
      return Array.from(values, value => possible[value % possible.length]).join('');
    }

    async function generateCodeChallenge(codeVerifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    function spotifyFetch(endpoint, options = {}) {
      const token = localStorage.getItem('access_token');

      return fetch(`https://api.spotify.com/v1${endpoint}`, {
        ...options,
        headers: {
          Authorization: `Bearer ${token}`,
          ...(options.headers || {})
        }
      }).then(async (response) => {
        if (response.status === 401) {
          localStorage.removeItem('access_token');
          showLogin();
          throw new Error('Unauthorized');
        }
        return response;
      });
    }

    async function redirectToSpotify() {
      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);

      localStorage.setItem('pkce_verifier', verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: 'code',
        redirect_uri: REDIRECT_URI,
        scope: 'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',
        code_challenge_method: 'S256',
        code_challenge: challenge
      });

      window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function getAccessToken(code) {
      const verifier = localStorage.getItem('pkce_verifier');

      if (!verifier) {
        console.error('Kein PKCE Verifier gefunden.');
        showLogin();
        return;
      }

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: 'authorization_code',
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      try {
        const response = await fetch('https://accounts.spotify.com/api/token', {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: params
        });

        const data = await response.json();

        if (data.access_token) {
          localStorage.setItem('access_token', data.access_token);

          if (data.refresh_token) {
            localStorage.setItem('refresh_token', data.refresh_token);
          }

          localStorage.removeItem('pkce_verifier');
          window.history.replaceState({}, document.title, window.location.pathname);

          loadCategories(data.access_token);
        } else {
          console.error('Spotify Fehler-Details:', data);
          setLoading('Fehler: ' + (data.error_description || 'Token abgelehnt'));
        }
      } catch (err) {
        console.error('Fetch Error:', err);
        setLoading('Netzwerkfehler beim Token-Tausch.');
      }
    }

    async function validateStoredToken() {
      const token = localStorage.getItem('access_token');

      if (!token) {
        showLogin();
        return false;
      }

      try {
        const res = await fetch('https://api.spotify.com/v1/me', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (res.status === 401) {
          localStorage.removeItem('access_token');
          localStorage.removeItem('refresh_token');
          showLogin();
          return false;
        }

        if (res.ok) {
          const data = await res.json();
          if (data && data.id) {
            return true;
          }
        }

        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
        showLogin();
        return false;
      } catch (err) {
        console.error('Token-Validierung fehlgeschlagen:', err);
        return false;
      }
    }

    async function loadCategories(token) {
      setLoading('Lade Übersichten...');
      ui.loginBtn.style.display = 'none';
      ui.navBar.style.display = 'none';
      setPageTitle('KinderPlayer');
      setNowPlayingText('Kein Titel aktiv');

      ui.grid.innerHTML = '';

      try {
        const res = await spotifyFetch('/me/playlists?limit=50', {
          headers: { Authorization: `Bearer ${token}` }
        });

        const data = await res.json();
        ui.loading.style.display = 'none';

        const playlists = data.items || [];
        const kidPlaylists = playlists.filter(pl => pl.name && pl.name.startsWith(PREFIX));

        if (kidPlaylists.length === 0) {
          ui.grid.innerHTML = `<p class="empty-state">Keine Playlists mit <b>${PREFIX}</b> im Namen in Spotify gefunden!</p>`;
          return;
        }

        kidPlaylists.forEach(pl => {
          const cleanTitle = pl.name.replace(PREFIX, '').trim();
          const imageUrl = pl.images && pl.images.length > 0 ? pl.images[0].url : '';

          const tile = createTile({
            title: cleanTitle,
            imageUrl,
            onClick: () => loadPlaylistTracks(token, pl.id, cleanTitle)
          });

          ui.grid.appendChild(tile);
        });

        updateCurrentlyPlaying();

      } catch (err) {
        console.error('Fehler beim Laden der Kategorien:', err);
        setLoading('Fehler beim Laden der Übersichten.');
      }
    }

    async function loadPlaylistTracks(token, playlistId, title) {
      setLoading('Lade Folgen...');
      ui.loginBtn.style.display = 'none';
      ui.grid.innerHTML = '';
      ui.navBar.style.display = 'block';
      setPageTitle(title);

      try {
        const res = await spotifyFetch(`/playlists/${playlistId}/items?limit=100`);

        if (!res.ok) {
          const errData = await res.json();
          console.error('API Fehler-Details:', errData);
          setLoading(`Spotify Fehler ${res.status}: ${errData.error?.message || 'Zugriff verweigert'}`);
          return;
        }

        const data = await res.json();
        ui.loading.style.display = 'none';
        ui.playerControls.style.display = 'block';

        ui.grid.innerHTML = '';

        const items = data.items || [];

        if (items.length === 0) {
          ui.loading.style.display = 'block';
          setLoading('Keine Titel in dieser Playlist gefunden.');
          return;
        }

        items.forEach(item => {
          const track = item.track || item.item || item.episode;
          if (!track) return;

          const imageUrl = track.album?.images[0]?.url || track.images?.[0]?.url || '';

          const tile = createTile({
            title: track.name,
            imageUrl,
            trackId: track.id,
            onClick: async () => {
              try {
                const playPayload = {
                  context_uri: `spotify:playlist:${playlistId}`,
                  offset: { uri: `spotify:track:${track.id}` }
                };

                let playRes = await fetch('https://api.spotify.com/v1/me/player/play', {
                  method: 'PUT',
                  headers: {
                    Authorization: `Bearer ${token}`,
                    'Content-Type': 'application/json'
                  },
                  body: JSON.stringify(playPayload)
                });

                if (playRes.status === 404) {
                  const devicesRes = await fetch('https://api.spotify.com/v1/me/player/devices', {
                    headers: { Authorization: `Bearer ${token}` }
                  });

                  if (devicesRes.ok) {
                    const devicesData = await devicesRes.json();
                    const devices = devicesData.devices || [];

                    if (devices.length > 0) {
                      const targetDeviceId = devices[0].id;

                      playRes = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${targetDeviceId}`, {
                        method: 'PUT',
                        headers: {
                          Authorization: `Bearer ${token}`,
                          'Content-Type': 'application/json'
                        },
                        body: JSON.stringify(playPayload)
                      });
                    }
                  }
                }

                if (playRes.status === 404) {
                  showNotice('Achtung: Spotify ist auf dem Abspielgerät nicht bereit. Bitte einmal die Spotify-App auf dem Zielgerät öffnen!');
                } else if (!playRes.ok) {
                  const err = await playRes.json();
                  console.error('Wiedergabefehler:', err);
                } else {
                  hideNotice();
                  setNowPlayingText(track.name);
                  setTimeout(updateCurrentlyPlaying, 500);
                }

              } catch (e) {
                console.error('Netzwerkfehler bei Play:', e);
              }
            }
          });

          ui.grid.appendChild(tile);
        });

        updateCurrentlyPlaying();

      } catch (err) {
        console.error('Netzwerkfehler:', err);
        setLoading('Fehler beim Laden der Tracks.');
      }
    }

    function markActiveTile(playingTrackId) {
      const tiles = document.querySelectorAll('.tile');

      tiles.forEach(tile => {
        if (tile.dataset.trackId === playingTrackId) {
          tile.classList.add('active');
        } else {
          tile.classList.remove('active');
        }
      });
    }

    async function updateCurrentlyPlaying() {
      const token = localStorage.getItem('access_token');
      if (!token) return;

      const currentSequence = ++updateSequence;

      try {
        const res = await fetch('https://api.spotify.com/v1/me/player', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (currentSequence !== updateSequence) return;

        if (res.status === 200) {
          const data = await res.json();
          ui.playerControls.style.display = 'block';
          setPlayPauseIcon(data.is_playing);

          if (data.item) {
            markActiveTile(data.item.id);
            setNowPlayingText(data.item.name);
          } else {
            setNowPlayingText('Kein Titel aktiv');
          }
        } else if (res.status === 204) {
          setPlayPauseIcon(false);
          markActiveTile(null);
          setNowPlayingText('Kein Titel aktiv');
        }
      } catch (e) {
        console.error('Fehler beim Abrufen des Player-Status:', e);
      }
    }

    function preventAppCloseInPinning() {
      window.history.pushState({ page: 'home' }, '', window.location.href);

      window.addEventListener('popstate', function () {
        window.history.pushState({ page: 'home' }, '', window.location.href);
      });
    }

    function renderLastModified() {
      const versionEl = document.getElementById('app-version');
      if (!versionEl) return;

      const lastModified = new Date(document.lastModified);
      const formattedDate = lastModified.toLocaleString('de-DE', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric',
        hour: '2-digit',
        minute: '2-digit'
      });

      versionEl.innerText = `Stand: ${formattedDate} Uhr, (c) Christian Waschke`;
    }

    document.getElementById('login-btn').addEventListener('click', redirectToSpotify);

    document.getElementById('play-pause-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('access_token');
      if (!token) return;

      try {
        const stateRes = await fetch('https://api.spotify.com/v1/me/player', {
          headers: { Authorization: `Bearer ${token}` }
        });

        if (stateRes.status === 200) {
          const playerState = await stateRes.json();
          const isCurrentlyPlaying = playerState.is_playing;
          const endpoint = isCurrentlyPlaying ? 'pause' : 'play';

          await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
            method: 'PUT',
            headers: { Authorization: `Bearer ${token}` }
          });

          setPlayPauseIcon(!isCurrentlyPlaying);
          if (playerState.item && playerState.item.name) {
            setNowPlayingText(playerState.item.name);
          }

          setTimeout(updateCurrentlyPlaying, 500);

        } else if (stateRes.status === 204 || stateRes.status === 404) {
          showNotice('Kein aktiver Player gefunden. Bitte erst ein Lied über eine Kachel starten!');
        }

      } catch (e) {
        console.error('Fehler beim Steuern der Wiedergabe:', e);
      }
    });

    document.getElementById('prev-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('access_token');
      if (!token) return;

      try {
        await fetch('https://api.spotify.com/v1/me/player/previous', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });
        setTimeout(updateCurrentlyPlaying, 500);
      } catch (e) {
        console.error('Fehler beim Zurückspringen:', e);
      }
    });

    document.getElementById('next-btn').addEventListener('click', async () => {
      const token = localStorage.getItem('access_token');
      if (!token) return;

      try {
        await fetch('https://api.spotify.com/v1/me/player/next', {
          method: 'POST',
          headers: { Authorization: `Bearer ${token}` }
        });
        setTimeout(updateCurrentlyPlaying, 500);
      } catch (e) {
        console.error('Fehler beim Vorwärtsspringen:', e);
      }
    });

    document.getElementById('back-to-main-btn').addEventListener('click', () => {
      const token = localStorage.getItem('access_token');
      if (token) loadCategories(token);
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Reg Fehler:', err));
    }

    if (performance.navigation && performance.navigation.type !== 1) {
      fetch(window.location.href, { cache: 'reload' });
    }

    function initializeApp() {
      const args = new URLSearchParams(window.location.search);
      const code = args.get('code');
      const storedToken = localStorage.getItem('access_token');

      if (code) {
        getAccessToken(code);
      } else if (storedToken) {
        validateStoredToken().then(valid => {
          if (valid) {
            loadCategories(storedToken);
          } else {
            showLogin();
          }
        });
      } else {
        showLogin();
      }
    }

    document.addEventListener('DOMContentLoaded', initializeApp);

    setInterval(updateCurrentlyPlaying, 5000);
    preventAppCloseInPinning();
    renderLastModified();
  </script>
</body>
</html>

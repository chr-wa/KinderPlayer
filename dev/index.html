<!DOCTYPE html>
<html lang="de">
<head>

  <title>Kinder Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    *{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif;touch-action:pan-y}body.detail{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold;cursor:pointer}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-bar.sticky{position:sticky;top:10px;z-index:9;background:#121212;padding:10px 0;border-radius:12px}.category-tile{background:#282828;color:#fff;border:3px solid transparent;border-radius:12px;padding:12px 18px;font-weight:bold;cursor:pointer}.category-tile.active{border-color:#1db954;background:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.tile.active{border-color:#1db954!important;background:#333;transform:scale(1.03);box-shadow:0 4px 15px rgba(29,185,84,.4)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:block;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.loading{display:none;text-align:center;color:#888;font-size:1.1rem;margin:35px 0}.nav{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10;width:max-content;max-width:calc(100% - 30px)}.back-btn{background:#282828;color:#fff;border:1px solid rgba(255,255,255,.15);padding:10px 22px;border-radius:25px;font-size:.95rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.controls{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:20;background:rgba(24,24,24,.95);backdrop-filter:blur(8px);padding:10px 20px;border-radius:30px;box-shadow:0 4px 16px rgba(0,0,0,.25)}.player-controls-inner{display:flex;align-items:center;justify-content:center;gap:20px}.player-button{background:none;border:0;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center}.player-button.primary{background:#1db954;width:48px;height:48px;border-radius:50%}.now-playing{text-align:center;color:#e5e5e5;font-size:.85rem;font-weight:600;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;margin-top:6px}
  </style>
</head>
<body>
  <h1 id="title">KinderPlayer</h1>
  <button id="login" class="btn-login" style="display:none" type="button">Einmalig bei Spotify anmelden</button>
  <div id="categories" class="category-bar" style="display:none"></div>
  <div id="loading" class="loading"></div>
  <div id="grid" class="grid"></div>
  <div id="nav" class="nav">
    <button id="back" class="back-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      <span>Zurück zur Übersicht</span>
    </button>
  </div>
  <div id="controls" class="controls">
    <div class="player-controls-inner">
      <button id="previous" class="player-button" type="button" aria-label="Vorheriger Titel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      <button id="toggle" class="player-button primary" type="button" aria-label="Abspielen/Pausieren">
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button id="next" class="player-button" type="button" aria-label="Nächster Titel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
    <div id="now" class="now-playing">Kein Titel aktiv</div>
  </div>

  <script src="https://sdk.scdn.co/spotify-player.js"></script>
  <script>
    const CLIENT_ID = 'a6c7e7f802d043c29cce919b9e0c7f45', REDIRECT_URI = 'https://chr-wa.github.io/KinderPlayer/', CATEGORIES = [{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];
    const OAUTH_SCOPE = 'streaming user-read-email user-read-private user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative';
    const REQUIRED_SCOPES = ['streaming', 'user-read-email', 'user-read-private', 'user-read-playback-state', 'user-modify-playback-state'];
    const $ = id => document.getElementById(id), token = () => localStorage.getItem('access_token');
    let playlists = [], category = null, requestId = 0, lastActive = null, webPlayer = null, webPlayerDeviceId = null, webPlayerReady = false, currentPlaybackMode = 'track';

    function loading(text) { $('loading').textContent = text || ''; $('loading').style.display = text ? 'block' : 'none'; }
    function setDetail(v) { $('nav').style.display = v ? 'block' : 'none'; document.body.classList.toggle('detail', v); $('categories').classList.toggle('sticky', !v); }
    function resetWebPlayer() {
      if (webPlayer) {
        try { webPlayer.disconnect(); } catch (error) { console.warn('Web-Player Disconnect fehlgeschlagen:', error); }
      }
      webPlayer = null;
      webPlayerDeviceId = null;
      webPlayerReady = false;
      currentPlaybackMode = 'track';
    }
    function showLogin() { loading(''); $('login').style.display = 'block'; $('categories').style.display = 'none'; $('grid').innerHTML = ''; $('controls').style.display = 'none'; setDetail(false); markActive(null); resetWebPlayer(); }
    function clearAuth() { localStorage.removeItem('access_token'); localStorage.removeItem('refresh_token'); localStorage.removeItem('oauth_scopes'); resetWebPlayer(); }
    function hasRequiredScopes(scopeString) {
      if (!scopeString) return false;
      const scopes = new Set(scopeString.split(/\s+/).filter(Boolean));
      return REQUIRED_SCOPES.every(scope => scopes.has(scope));
    }
    function showNotice(message) {
      let notice = document.getElementById('player-notice');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'player-notice';
        notice.setAttribute('role', 'status');
        notice.setAttribute('aria-live', 'assertive');
        notice.style.cssText = 'position:fixed;bottom:85px;left:50%;transform:translateX(-50%);z-index:200;max-width:90vw;background:#ff4d4d;color:#fff;padding:12px 24px;border-radius:20px;font-weight:bold;box-shadow:0 8px 25px rgba(0,0,0,.25);text-align:center';
        document.body.appendChild(notice);
      }
      notice.textContent = message;
      notice.style.display = 'block';
    }
    function hideNotice() {
      const notice = document.getElementById('player-notice');
      if (notice) notice.style.display = 'none';
    }
    function applyPlaybackState(isPlaying, item) {
      $('play-icon').style.display = isPlaying ? 'none' : 'block';
      $('pause-icon').style.display = isPlaying ? 'block' : 'none';
      if (item) {
        const uri = item?.uri || '';
        currentPlaybackMode = item?.type === 'episode' || uri.startsWith('spotify:episode:') ? 'podcast' : 'track';
      }
      const id = item?.id || item?.uri?.split(':').pop();
      if (id) {
        lastActive = { id: String(id), title: item?.name || lastActive?.title || 'Kein Titel aktiv' };
        $('now').textContent = lastActive.title;
        markActive(id);
      } else if (lastActive) {
        $('now').textContent = lastActive.title;
        markActive(lastActive.id);
      } else {
        $('now').textContent = 'Kein Titel aktiv';
        markActive(null);
      }
    }
    async function api(path, options = {}) {
      const r = await fetch('https://api.spotify.com/v1' + path, { ...options, headers: { Authorization: 'Bearer ' + token(), ...(options.headers || {}) } });
      if (r.status === 401) { clearAuth(); showLogin(); throw Error('Nicht autorisiert'); }
      return r;
    }
    function entry(item) { return item?.track || item?.item || item?.episode || null; }
    function cleanName(name) { const p = CATEGORIES.find(c => name.startsWith(c.prefix)); return p ? name.slice(p.prefix.length).trim() : name; }
    function makeTile(title, image, onClick, id, isPodcast = false, description = '') {
      const t = document.createElement('div'); t.className = 'tile'; t.dataset.trackId = String(id || ''); t.onclick = () => onClick(false);
      const img = document.createElement('img'); img.src = image || ''; img.alt = '';
      const label = document.createElement('div'); label.className = 'tile-title'; label.textContent = title;
      t.append(img, label);
      if (description) {
        const desc = document.createElement('div');
        desc.style.cssText = 'margin-top:6px;color:#b3b3b3;font-size:.8rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden';
        desc.textContent = description;
        t.append(desc);
      }
      if (isPodcast) {
        const b = document.createElement('button'); b.type = 'button'; b.className = 'restart-btn'; b.textContent = '↺ Von Anfang an';
        b.onclick = e => { e.stopPropagation(); onClick(true); }; t.append(b);
      }
      return t;
    }
    function normalizeEpisodeTitle(title) { return String(title || '').replace(/\s+/g, ' ').trim(); }
    function normalizeForKey(value) {
      return normalizeEpisodeTitle(value).toLocaleLowerCase('de-DE').replace(/[–—]/g, '-').replace(/\s+/g, ' ');
    }
    function removeFolgeMarkers(title) {
      return normalizeEpisodeTitle(title)
        .replace(/\(\s*folge\s*\d+[a-z]?\s*\)/gi, ' ')
        .replace(/\bfolge\s*\d+[a-z]?\b/gi, ' ')
        .replace(/\s+/g, ' ')
        .replace(/\s*[-–—:|]\s*$/g, '')
        .trim();
    }
    function parseAudioEpisodeMeta(title) {
      const normalized = normalizeEpisodeTitle(title);
      if (!normalized) return null;
      const folgeMatch = normalized.match(/\bfolge\s*(\d+[a-z]?)\b/i);
      const folgeNumber = folgeMatch ? folgeMatch[1].toLocaleLowerCase('de-DE') : null;
      let working = normalized;
      let specialType = null;
      const summaryMatch = working.match(/^\s*inhaltsangabe\s*[:\-–—]\s*(.+)$/i);
      if (summaryMatch) {
        specialType = 'summary';
        working = normalizeEpisodeTitle(summaryMatch[1]);
      }
      let chapterNumber = null;
      let chapterTotal = null;
      const chapterPatterns = [
        { prefix: true, regex: /^(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s*[:\-–—]\s*(.+)$/i },
        { prefix: true, regex: /^(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s+(.+)$/i },
        { prefix: false, regex: /^(.+?)\s*[:\-–—]\s*(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s*$/i },
        { prefix: false, regex: /^(.+?)\s+(?:kapitel|teil)\s*0*(\d+)(?:\s*\/\s*0*(\d+))?\s*$/i }
      ];
      for (const pattern of chapterPatterns) {
        const match = working.match(pattern.regex);
        if (!match) continue;
        if (pattern.prefix) {
          chapterNumber = Number(match[1]);
          chapterTotal = match[2] ? Number(match[2]) : null;
          working = normalizeEpisodeTitle(match[3]);
        } else {
          chapterNumber = Number(match[2]);
          chapterTotal = match[3] ? Number(match[3]) : null;
          working = normalizeEpisodeTitle(match[1]);
        }
        break;
      }
      const cleanedTitle = removeFolgeMarkers(working);
      const storyKey = normalizeForKey(cleanedTitle);
      const isThemeLike = /\b(?:titellied|intro|outro)\b/i.test(normalized);
      if (!specialType && isThemeLike) specialType = 'theme';
      return { normalized, folgeNumber, chapterNumber, chapterTotal, cleanedTitle, storyKey, specialType };
    }
    function getAudioEpisodeContextKey(episode) {
      const album = normalizeForKey(episode?.album?.name || episode?.show?.name || '');
      const artist = normalizeForKey(
        (episode?.album?.artists || []).map(a => a?.name).filter(Boolean).join(' | ') ||
        episode?.show?.publisher ||
        ''
      );
      return `${album}::${artist}`;
    }
    function getAudioEpisodeStoryScopeKey(episode, meta) {
      if (!episode?.id || !meta?.storyKey) return null;
      return `${getAudioEpisodeContextKey(episode)}::${meta.storyKey}`;
    }
    function getAudioEpisodeGroupKey(episode, meta) {
      const storyScope = getAudioEpisodeStoryScopeKey(episode, meta);
      if (!storyScope) return null;
      const folgePart = meta.folgeNumber ? `folge:${meta.folgeNumber}` : 'folge:';
      return `${storyScope}::${folgePart}`;
    }
    function hasContiguousChapters(numbers, expectedTotal) {
      if (!numbers.length) return false;
      const uniqueSorted = [...new Set(numbers)].sort((a, b) => a - b);
      const target = expectedTotal || uniqueSorted[uniqueSorted.length - 1];
      if (target < 1 || uniqueSorted[0] !== 1) return false;
      if (uniqueSorted.length !== target) return false;
      for (let i = 0; i < target; i++) {
        if (uniqueSorted[i] !== i + 1) return false;
      }
      return true;
    }
    function hasContiguousPlaylistBlock(entries) {
      if (!entries.length) return false;
      const sortedIndices = entries.map(e => e.index).sort((a, b) => a - b);
      for (let i = 1; i < sortedIndices.length; i++) {
        if (sortedIndices[i] - sortedIndices[i - 1] !== 1) return false;
      }
      return true;
    }
    function groupChaptersByEpisode(episodes) {
      const parsed = episodes.map((episode, index) => ({ episode, index, meta: parseAudioEpisodeMeta(episode?.name || '') }))
        .filter(x => x.episode?.id && x.meta);
      const chapterGroups = new Map();
      parsed.forEach(item => {
        if (!item.meta.chapterNumber || !item.meta.storyKey) return;
        const key = getAudioEpisodeGroupKey(item.episode, item.meta);
        const storyScopeKey = getAudioEpisodeStoryScopeKey(item.episode, item.meta);
        if (!key) return;
        if (!chapterGroups.has(key)) {
          chapterGroups.set(key, { key, storyScopeKey, displayName: item.meta.cleanedTitle || item.episode.name, entries: [], chapterEntries: [], explicitTotals: new Set() });
        }
        const group = chapterGroups.get(key);
        group.entries.push(item);
        group.chapterEntries.push(item);
        if (item.meta.chapterTotal && item.meta.chapterTotal > 0) group.explicitTotals.add(item.meta.chapterTotal);
      });
      const chapterGroupKeysByStoryScope = new Map();
      chapterGroups.forEach(group => {
        const keys = chapterGroupKeysByStoryScope.get(group.storyScopeKey) || new Set();
        keys.add(group.key);
        chapterGroupKeysByStoryScope.set(group.storyScopeKey, keys);
      });
      const completeGroups = new Map();
      const completeGroupsByStoryScope = new Map();
      chapterGroups.forEach(group => {
        const chapterNumbers = group.chapterEntries.map(e => e.meta.chapterNumber).filter(n => Number.isInteger(n) && n > 0);
        let isComplete = false;
        const hasDuplicateChapterNumbers = new Set(chapterNumbers).size !== chapterNumbers.length;
        if (hasDuplicateChapterNumbers) {
          isComplete = false;
        } else if (group.explicitTotals.size === 1) {
          const expected = [...group.explicitTotals][0];
          isComplete = hasContiguousPlaylistBlock(group.chapterEntries) && hasContiguousChapters(chapterNumbers, expected);
        } else if (group.explicitTotals.size > 1) {
          isComplete = false;
        } else {
          const competingGroupKeys = chapterGroupKeysByStoryScope.get(group.storyScopeKey) || new Set();
          if (competingGroupKeys.size > 1) {
            isComplete = false;
          } else {
            const maxChapter = chapterNumbers.length ? Math.max(...chapterNumbers) : 0;
            const hasReliableBlock = hasContiguousPlaylistBlock(group.chapterEntries);
            isComplete = maxChapter >= 3 && hasReliableBlock && hasContiguousChapters(chapterNumbers, null);
          }
        }
        if (isComplete) {
          completeGroups.set(group.key, group);
          const scopedGroups = completeGroupsByStoryScope.get(group.storyScopeKey) || [];
          scopedGroups.push(group);
          completeGroupsByStoryScope.set(group.storyScopeKey, scopedGroups);
        }
      });
      parsed.forEach(item => {
        if (item.meta.chapterNumber) return;
        if (!item.meta.specialType || !item.meta.storyKey) return;
        const storyScopeKey = getAudioEpisodeStoryScopeKey(item.episode, item.meta);
        if (!storyScopeKey) return;
        let group = null;
        if (item.meta.folgeNumber) {
          const targetKey = getAudioEpisodeGroupKey(item.episode, item.meta);
          if (targetKey) group = completeGroups.get(targetKey) || null;
        } else {
          const candidates = completeGroupsByStoryScope.get(storyScopeKey) || [];
          if (candidates.length === 1) {
            group = candidates[0];
          }
        }
        if (!group) return;
        if (group.entries.some(entry => entry.episode?.id === item.episode?.id)) return;
        group.entries.push(item);
      });
      return [...completeGroups.values()]
        .map(group => ({ ...group, entries: [...group.entries].sort((a, b) => a.index - b.index) }))
        .sort((a, b) => a.entries[0].index - b.entries[0].index)
        .map(group => {
          const chapterEntries = group.entries
            .filter(entry => Number.isInteger(entry.meta?.chapterNumber))
            .sort((a, b) => (a.meta.chapterNumber - b.meta.chapterNumber) || (a.index - b.index));
          const specialEntries = group.entries.filter(entry => !Number.isInteger(entry.meta?.chapterNumber));
          const orderedEntries = chapterEntries.concat(specialEntries);
          const titleFromSummary = group.entries.find(entry => entry.meta?.specialType === 'summary' && entry.meta.cleanedTitle)?.meta.cleanedTitle;
          const resolvedTitle = titleFromSummary && normalizeForKey(titleFromSummary) === normalizeForKey(group.displayName) ? titleFromSummary : group.displayName;
          return { key: group.key, title: resolvedTitle, episodes: orderedEntries.map(e => e.episode) };
        });
    }
    function renderCategories() {
      const b = $('categories'); b.innerHTML = '';
      CATEGORIES.forEach(c => {
        const x = document.createElement('button'); x.type = 'button'; x.className = 'category-tile' + (category === c.key ? ' active' : '');
        x.textContent = c.label; x.onclick = () => { category = category === c.key ? null : c.key; renderCategories(); renderPlaylists(); }; b.append(x);
      });
      b.style.display = 'flex';
    }
    function renderPlaylists() {
      const b = $('grid'), c = CATEGORIES.find(x => x.key === category), list = c ? playlists.filter(p => p.name.startsWith(c.prefix)) : playlists;
      b.innerHTML = '';
      if (!list.length) {
        const empty = document.createElement('p');
        empty.textContent = 'Keine Playlists gefunden.';
        empty.style.cssText = 'text-align:center;width:100%;color:#888;grid-column:1/-1';
        b.append(empty);
        loading('');
        return;
      }
      list.forEach(p => {
        const type = CATEGORIES.find(x => p.name.startsWith(x.prefix));
        b.append(makeTile(cleanName(p.name), p.images?.[0]?.url, () => loadPlaylist(p.id, cleanName(p.name), type?.key), p.id));
      });
      loading(''); updatePlayer();
    }
    async function overview() {
      const id = ++requestId; loading('Lade Playlists...'); $('login').style.display = 'none'; setDetail(false); $('title').textContent = 'KinderPlayer';
      currentPlaybackMode = 'track';
      try {
        const d = await (await api('/me/playlists?limit=50')).json(); if (id !== requestId) return;
        playlists = (d.items || []).filter(p => p.name && CATEGORIES.some(c => p.name.startsWith(c.prefix)));
        renderCategories(); renderPlaylists();
      } catch (e) { if (id === requestId) { console.error(e); loading('Fehler beim Laden der Playlists.'); } }
    }
    function markActive(id) { const x = id == null ? null : String(id); document.querySelectorAll('.tile').forEach(t => t.classList.toggle('active', x !== null && t.dataset.trackId === x)); }

    async function fetchShowEpisodes(showId) {
      const episodes = [], seen = new Set();
      for (const url of [`/shows/${showId}/episodes?limit=50&market=DE`, `/shows/${showId}/episodes?limit=50`]) {
        let next = url;
        try {
          while (next) {
            const r = await api(next); if (!r.ok) throw Error(String(r.status));
            const d = await r.json(); (d.items || []).forEach(ep => { if (ep?.id && !seen.has(ep.id)) { seen.add(ep.id); episodes.push(ep); } });
            next = d.next ? new URL(d.next).pathname + new URL(d.next).search : null;
          }
          if (episodes.length > 0) return episodes;
        } catch (err) { console.warn('Show-Folgenabruf:', url, err); }
      }
      return episodes;
    }

    async function resolveShowId(items, title) {
      for (const raw of items) {
        const e = entry(raw); if (!e) continue;
        const sid = e.show?.id || raw?.show?.id; if (sid) return sid;
      }
      const firstItem = items[0];
      if (firstItem) {
        try {
          const e = entry(firstItem); if (e) {
            const r = await api(`/episodes/${e.id}`); if (r.ok) {
              const d = await r.json(); if (d.show?.id) return d.show.id;
            }
          }
        } catch (err) { console.warn('Detail-Abfrage fehlgeschlagen', err); }
      }
      try {
        const query = encodeURIComponent(title);
        const response = await api(`/search?q=${query}&type=show&limit=1&market=DE`);
        if (response.ok) {
          const data = await response.json();
          const show = data.shows?.items?.[0]; if (show) return show.id;
        }
      } catch (e) { console.warn('Namenssuche fehlgeschlagen', e); }
      return null;
    }

    async function enqueueEpisode(episodeId) {
      const uri = `spotify:episode:${episodeId}`;
      let queueUrl = `https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(uri)}`;
      if (webPlayerDeviceId) queueUrl += `&device_id=${encodeURIComponent(webPlayerDeviceId)}`;
      let response = await fetch(queueUrl, { method: 'POST', headers: { Authorization: 'Bearer ' + token() } });
      if (response.status === 404 && webPlayerDeviceId) {
        response = await fetch(`https://api.spotify.com/v1/me/player/queue?uri=${encodeURIComponent(uri)}`, { method: 'POST', headers: { Authorization: 'Bearer ' + token() } });
      }
      if (response.status === 401) {
        clearAuth();
        showLogin();
      }
      return response;
    }
    async function playEpisodeGroup(group, restart) {
      const episodes = group?.episodes || [];
      if (!episodes.length) return;
      const started = await playEpisode(episodes[0], restart);
      if (!started || episodes.length < 2) return;
      let queued = 0;
      for (const episode of episodes.slice(1)) {
        try {
          const queueResponse = await enqueueEpisode(episode.id);
          if (queueResponse.ok) {
            queued++;
            continue;
          }
          if (queueResponse.status === 404) break;
        } catch (error) {
          console.warn('Queueing fehlgeschlagen:', error);
          break;
        }
      }
      if (queued !== episodes.length - 1) {
        showNotice('Erstes Kapitel läuft. Weitere Kapitel konnten nicht vollständig zur Warteschlange hinzugefügt werden.');
      }
    }
    async function loadPlaylist(id, title, categoryKey) {
      const current = ++requestId; loading('Lade Inhalte...'); $('categories').style.display = 'none'; setDetail(true); $('grid').innerHTML = ''; $('title').textContent = title;
      const isPodcast = categoryKey === 'podcast';
      const isAudioDrama = categoryKey === 'audio';
      try {
        const firstResponse = await api(`/playlists/${id}/items?limit=100`); if (current !== requestId) return;
        if (!firstResponse.ok) throw Error('Playlist konnte nicht geladen werden');
        const firstPage = await firstResponse.json();
        let items = firstPage.items || [];
        let next = firstPage.next ? new URL(firstPage.next).pathname + new URL(firstPage.next).search : null;
        if (!items.length) { loading('Keine Inhalte gefunden.'); return; }
        if (isPodcast) {
          const showId = await resolveShowId(items, title);
          if (showId) {
            const episodes = await fetchShowEpisodes(showId);
            if (episodes.length > 0) {
              const b = $('grid'); b.innerHTML = '';
              episodes.forEach(ep => b.append(makeTile(ep.name, ep.images?.[0]?.url, restart => playEpisode(ep, restart), ep.id, true)));
              loading(''); $('controls').style.display = 'block'; updatePlayer(); return;
            }
          }
        }
        while (next) {
          const r = await api(next); if (current !== requestId) return;
          if (!r.ok) throw Error('Playlist konnte nicht geladen werden');
          const d = await r.json();
          items = items.concat(d.items || []);
          next = d.next ? new URL(d.next).pathname + new URL(d.next).search : null;
        }
        if (isAudioDrama) {
          const episodes = items.map(entry).filter(e => e?.id && (e.type === 'episode' || String(e.uri || '').startsWith('spotify:episode:')));
          const groupedEpisodes = groupChaptersByEpisode(episodes);
          if (groupedEpisodes.length) {
            const b = $('grid'); b.innerHTML = '';
            groupedEpisodes.forEach(group => {
              const firstEpisode = group.episodes[0];
              const image = firstEpisode.images?.[0]?.url || '';
              b.append(makeTile(group.title || firstEpisode.name, image, restart => playEpisodeGroup(group, restart), firstEpisode.id, true, firstEpisode.description || ''));
            });
            loading(''); $('controls').style.display = 'block'; updatePlayer(); return;
          }
          loading('Keine vollständigen Folgen erkannt. Bitte alle Kapitel einer Folge zur Playlist hinzufügen.');
          return;
        }
        let rendered = 0;
        items.forEach(raw => {
          const e = entry(raw); if (!e) return;
          const isEpisodeItem = e.type === 'episode' || String(e.uri || '').startsWith('spotify:episode:');
          rendered++; const image = e.album?.images?.[0]?.url || e.images?.[0]?.url || '';
          $('grid').append(makeTile(e.name, image, restart => (isPodcast || isEpisodeItem) ? playEpisode(e, restart) : playTrack(id, e), e.id, isPodcast || isEpisodeItem));
        });
        if (current !== requestId) return;
        if (!rendered) { loading('Keine Folgen gefunden.'); return; }
        loading(''); $('controls').style.display = 'block'; updatePlayer();
      } catch (e) { if (current !== requestId) return; console.error(e); if (!$('grid').children.length) loading('Fehler beim Laden der Inhalte.'); else loading(''); }
    }

    async function play(body) {
      const playUrl = webPlayerDeviceId ? `https://api.spotify.com/v1/me/player/play?device_id=${encodeURIComponent(webPlayerDeviceId)}` : 'https://api.spotify.com/v1/me/player/play';
      let r = await fetch(playUrl, { method: 'PUT', headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      if (r.status === 401) {
        clearAuth();
        showLogin();
        return r;
      }
      if (r.status === 404 && webPlayerDeviceId) {
        webPlayerDeviceId = null;
        webPlayerReady = false;
        r = await fetch('https://api.spotify.com/v1/me/player/play', { method: 'PUT', headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        if (r.status === 401) {
          clearAuth();
          showLogin();
          return r;
        }
        if (!r.ok) showNotice('Web-Player nicht bereit oder Device-ID veraltet. Bitte Seite neu laden oder erneut anmelden.');
      }
      return r;
    }
    async function playTrack(pid, t) {
      try {
        const r = await play({ context_uri: `spotify:playlist:${pid}`, offset: { uri: `spotify:track:${t.id}` } });
        if (r.ok) {
          currentPlaybackMode = 'track';
          hideNotice();
          lastActive = { id: String(t.id), title: t.name };
          markActive(t.id);
          $('now').textContent = t.name;
          setTimeout(updatePlayer, 500);
          return;
        }
        if (r.status === 404) showNotice('Kein aktiver Player gefunden. Bitte erneut anmelden oder Spotify-App öffnen.');
      } catch (error) {
        console.error('Wiedergabe fehlgeschlagen:', error);
        showNotice('Wiedergabe konnte nicht gestartet werden.');
      }
    }
    async function playEpisode(e, restart) {
      const b = { uris: [`spotify:episode:${e.id}`] };
      if (restart) {
        b.position_ms = 0;
      } else if (typeof e?.resume_point?.resume_position_ms === 'number' && e.resume_point.resume_position_ms > 0) {
        b.position_ms = e.resume_point.resume_position_ms;
      }
      try {
        const r = await play(b);
        if (r.ok) {
          currentPlaybackMode = 'podcast';
          hideNotice();
          lastActive = { id: String(e.id), title: e.name };
          markActive(e.id);
          $('now').textContent = e.name;
          setTimeout(updatePlayer, 500);
          return true;
        }
        if (r.status === 404) showNotice('Kein aktiver Player gefunden. Bitte erneut anmelden oder Spotify-App öffnen.');
      } catch (error) {
        console.error('Episoden-Wiedergabe fehlgeschlagen:', error);
        showNotice('Episode konnte nicht gestartet werden.');
      }
      return false;
    }
    async function updatePlayer() {
      if (!token()) return;
      try {
        const r = await fetch('https://api.spotify.com/v1/me/player', { headers: { Authorization: 'Bearer ' + token() } });
        if (r.status === 200) {
          const d = await r.json(); $('controls').style.display = 'block'; applyPlaybackState(d.is_playing, d.item);
        } else if (r.status === 204) { applyPlaybackState(false, null); }
        else if (r.status === 401) { clearAuth(); showLogin(); }
      } catch (error) { if (lastActive) { $('now').textContent = lastActive.title; markActive(lastActive.id); } }
    }
    async function control(action) {
      try {
        if (currentPlaybackMode !== 'podcast' && webPlayer && webPlayerReady && (action === 'next' || action === 'previous')) {
          await (action === 'next' ? webPlayer.nextTrack() : webPlayer.previousTrack());
          hideNotice();
          setTimeout(updatePlayer, 500);
          return;
        }
      } catch (error) {
        console.warn('Web Playback SDK Steuerung fehlgeschlagen, nutze Fallback:', error);
      }
      const r = await fetch('https://api.spotify.com/v1/me/player/' + action, { method: action === 'next' || action === 'previous' ? 'POST' : 'PUT', headers: { Authorization: 'Bearer ' + token() } });
      if (r.status === 401) {
        clearAuth();
        showNotice('Token ungültig. Bitte erneut anmelden.');
        showLogin();
        return;
      }
      if (r.status === 404) {
        showNotice('Kein aktiver Player gefunden. Bitte zuerst einen Titel starten.');
        return;
      }
      if (!r.ok) showNotice('Steuerung fehlgeschlagen. Bitte Spotify-App prüfen.');
      setTimeout(updatePlayer, 500);
    }
    function randomString(length) { const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~', values = new Uint8Array(length); crypto.getRandomValues(values); return Array.from(values, value => chars[value % chars.length]).join(''); }
    async function activateWebPlayerDevice(deviceId) {
      try {
        const r = await fetch('https://api.spotify.com/v1/me/player', {
          method: 'PUT',
          headers: { Authorization: 'Bearer ' + token(), 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_ids: [deviceId], play: false })
        });
        if (!r.ok && r.status !== 204) console.warn('Device-Transfer fehlgeschlagen:', r.status);
      } catch (error) {
        console.warn('Device-Transfer Fehler:', error);
      }
    }
    function initWebPlayer() {
      if (webPlayer || !window.Spotify) return;
      webPlayer = new window.Spotify.Player({
        name: 'Web App Player',
        getOAuthToken: callback => callback(localStorage.getItem('access_token') || ''),
        volume: 0.8
      });
      webPlayer.addListener('ready', ({ device_id }) => {
        webPlayerDeviceId = device_id;
        webPlayerReady = true;
        hideNotice();
        activateWebPlayerDevice(device_id);
        updatePlayer();
      });
      webPlayer.addListener('not_ready', ({ device_id }) => {
        if (webPlayerDeviceId === device_id) webPlayerDeviceId = null;
        webPlayerReady = false;
      });
      webPlayer.addListener('initialization_error', ({ message }) => { console.warn('Spotify initialization_error:', message); showNotice('Web-Player konnte nicht initialisiert werden.'); });
      webPlayer.addListener('authentication_error', ({ message }) => {
        console.warn('Spotify authentication_error:', message);
        clearAuth();
        showNotice('Spotify-Anmeldung ungültig. Bitte erneut anmelden.');
        showLogin();
      });
      webPlayer.addListener('account_error', ({ message }) => { console.warn('Spotify account_error:', message); showNotice('Dieses Spotify-Konto kann Web Playback nicht nutzen.'); });
      webPlayer.addListener('playback_error', ({ message }) => { console.warn('Spotify playback_error:', message); showNotice('Wiedergabe fehlgeschlagen. Bitte erneut versuchen.'); });
      webPlayer.addListener('player_state_changed', state => {
        if (!state) return;
        $('controls').style.display = 'block';
        applyPlaybackState(!state.paused, state.track_window?.current_track);
      });
      webPlayer.connect().catch(error => {
        console.error('Web Playback Connect Fehler:', error);
        resetWebPlayer();
        showNotice('Web-Player konnte nicht verbunden werden. Nutze Standard-Spotify-Player.');
      });
    }
    window.onSpotifyWebPlaybackSDKReady = () => initWebPlayer();
    async function login() {
      const verifier = randomString(128), digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(verifier)), challenge = btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
      localStorage.setItem('pkce', verifier);
      const p = new URLSearchParams({ client_id: CLIENT_ID, response_type: 'code', redirect_uri: REDIRECT_URI, scope: OAUTH_SCOPE, code_challenge_method: 'S256', code_challenge: challenge });
      location.href = 'https://accounts.spotify.com/authorize?' + p;
    }
    async function exchange(code) {
      try {
        const verifier = localStorage.getItem('pkce');
        if (!verifier) {
          history.replaceState({}, document.title, location.pathname);
          showNotice('Anmeldung abgelaufen. Bitte erneut bei Spotify anmelden.');
          showLogin();
          return;
        }
        const p = new URLSearchParams({ client_id: CLIENT_ID, grant_type: 'authorization_code', code, redirect_uri: REDIRECT_URI, code_verifier: verifier });
        const r = await fetch('https://accounts.spotify.com/api/token', { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: p });
        const d = await r.json();
        if (d.access_token) {
          localStorage.setItem('access_token', d.access_token);
          if (d.refresh_token) localStorage.setItem('refresh_token', d.refresh_token);
          localStorage.setItem('oauth_scopes', d.scope || OAUTH_SCOPE);
          localStorage.removeItem('pkce');
          history.replaceState({}, document.title, location.pathname);
          initWebPlayer();
          overview();
        } else {
          localStorage.removeItem('pkce');
          showNotice('Autorisierung fehlgeschlagen. Nach Scope-Änderungen bitte erneut anmelden.');
          showLogin();
        }
      } catch (error) {
        console.error('Token-Tausch fehlgeschlagen:', error);
        localStorage.removeItem('pkce');
        showNotice('Autorisierung fehlgeschlagen. Bitte erneut anmelden.');
        showLogin();
      }
    }
    $('login').onclick = login; $('back').onclick = overview; $('previous').onclick = () => control('previous'); $('next').onclick = () => control('next'); $('toggle').onclick = async () => {
      try {
        const r = await fetch('https://api.spotify.com/v1/me/player', { headers: { Authorization: 'Bearer ' + token() } });
        if (r.status === 200) {
          const d = await r.json();
          if (webPlayer && webPlayerReady && d.device?.id === webPlayerDeviceId) {
            try {
              await webPlayer.togglePlay();
              hideNotice();
              setTimeout(updatePlayer, 500);
              return;
            } catch (error) {
              console.warn('SDK Toggle fehlgeschlagen, nutze Fallback:', error);
            }
          }
          await control(d.is_playing ? 'pause' : 'play');
        } else if (r.status === 204) {
          showNotice('Kein aktiver Titel. Bitte einen Titel über eine Kachel starten.');
        } else if (r.status === 404) {
          showNotice('Kein aktiver Player gefunden. Bitte zuerst einen Titel starten.');
        } else if (r.status === 401) {
          showNotice('Token ungültig. Bitte erneut anmelden.');
          clearAuth();
          showLogin();
        } else {
          showNotice('Player-Status konnte nicht geladen werden.');
        }
      } catch (error) {
        console.error('Fehler beim Umschalten von Play/Pause:', error);
        showNotice('Play/Pause konnte nicht ausgeführt werden.');
      }
    };
    (async () => {
      try {
        const params = new URLSearchParams(location.search);
        const authError = params.get('error');
        if (authError) {
          history.replaceState({}, document.title, location.pathname);
          showNotice('Spotify-Autorisierung fehlgeschlagen. Bitte erneut anmelden.');
          return showLogin();
        }
        const code = params.get('code'); if (code) return exchange(code);
        const t = localStorage.getItem('access_token'); if (!t) return showLogin();
        const storedScopes = localStorage.getItem('oauth_scopes');
        if (storedScopes && !hasRequiredScopes(storedScopes)) {
          clearAuth();
          showNotice('Neue Berechtigungen erforderlich. Bitte erneut bei Spotify anmelden.');
          return showLogin();
        }
        const r = await fetch('https://api.spotify.com/v1/me', { headers: { Authorization: 'Bearer ' + t } });
        if (r.ok) { initWebPlayer(); overview(); } else { clearAuth(); showLogin(); }
      } catch (error) {
        console.error('Initialisierung fehlgeschlagen:', error);
        showLogin();
      }
    })();
    setInterval(updatePlayer, 5000);
  </script>

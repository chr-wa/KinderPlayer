;border-radius:50%}.now-playing{text-align:center;color:#e5e5e5;font-size:.85rem;font-weight:600;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 8px;margin-top:6px}.nav-bar{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:101;text-align:center;margin:0}.back-btn{background:#282828;color:#fff;border:1px solid #ffffff26;padding:10px 22px;border-radius:25px;font-size:.95rem;font-weight:bold;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}.app-version{text-align:center;color:#555;font-size:.8rem;margin:30px 0 10px}.empty-state{text-align:center;grid-column:1/-1}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f44;color:#fff;padding:12px 24px;border-radius:20px;font-weight:bold;display:none;z-index:200;max-width:90vw;text-align:center}@media(max-width:480px){body{padding:65px 15px 125px}h1{font-size:1.5rem}.grid-container{gap:12px}.category-tile{padding:10px 12px;font-size:.9rem}.player-controls{bottom:10px;width:calc(100% - 30px)}.nav-bar{top:10px;width:calc(100% - 30px)}.back-btn{width:100%}}

      </button>

<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45';
const REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/';
const CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];
const ui={login:document.getElementById('login-btn'),loading:document.getElementById('loading'),grid:document.getElementById('kachel-grid'),title:document.getElementById('page-title'),categories:document.getElementById('category-bar'),controls:document.getElementById('player-controls'),nav:document.getElementById('nav-bar'),now:document.getElementById('now-playing'),play:document.getElementById('play-icon'),pause:document.getElementById('pause-icon')};
let allPlaylists=[],selectedCategory=null,sequence=0;
const setLoading=(text,show=true)=>{ui.loading.textContent=text;ui.loading.style.display=show?'block':'none'};
const spotify=(path,options={})=>fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+localStorage.getItem('access_token'),...(options.headers||{})}}).then(r=>{if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Unauthorized')}return r});
function showLogin(){ui.loading.style.display='none';ui.login.style.display='block';ui.categories.style.display='none';ui.controls.style.display='none';ui.nav.style.display='none'}
function tile(title,image,onClick,trackId){const el=document.createElement('div');el.className='tile';if(trackId)el.dataset.trackId=trackId;el.onclick=onClick;el.innerHTML=`<img src="${image||''}" alt=""><div class="tile-title"></div>`;el.querySelector('.tile-title').textContent=title;return el}

function renderPlaylists(){ui.grid.innerHTML='';const category=CATEGORIES.find(c=>c.key===selectedCategory);const playlists=category?allPlaylists.filter(p=>p.name.startsWith(category.prefix)):allPlaylists;if(!playlists.length){ui.grid.innerHTML='<p class="empty-state">Keine Playlists für diese Auswahl gefunden.</p>';return}playlists.forEach(p=>{const categoryPrefix=CATEGORIES.find(c=>p.name.startsWith(c.prefix));const title=p.name.replace(categoryPrefix?categoryPrefix.prefix:'','').trim();ui.grid.appendChild(tile(title,p.images?.[0]?.url,()=>loadTracks(p.id,title)))});updatePlayer()}

async function play(id,t){const payload={context_uri:`spotify:playlist:${id}`,offset:{uri:`spotify:track:${t.id}`}};try{let r=await fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+localStorage.getItem('access_token'),'Content-Type':'application/json'},body:JSON.stringify(payload)});if(r.ok){ui.now.textContent=t.name;setTimeout(updatePlayer,500)}else if(r.status===404)notice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}catch(e){console.error(e)}}

function active(id){document.querySelectorAll('.tile').forEach(x=>x.classList.toggle('active',x.dataset.trackId===id))}
async function updatePlayer(){const n=++sequence;try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+localStorage.getItem('access_token')}});if(n!==sequence)return;if(r.status===200){const d=await r.json();ui.controls.style.display='block';ui.play.style.display=d.is_playing?'none':'block';ui.pause.style.display=d.is_playing?'block':'none';if(d.item){active(d.item.id);ui.now.textContent=d.item.name}}else if(r.status===204){ui.play.style.display='block';ui.pause.style.display='none';ui.now.textContent='Kein Titel aktiv'}}catch(e){console.error(e)}}
async function control(path){try{await fetch('https://api.spotify.com/v1/me/player/'+path,{method:path==='next'||path==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+localStorage.getItem('access_token')}});setTimeout(updatePlayer,500)}catch(e){console.error(e)}}
function random(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return [...a].map(x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x%66]).join('')}
async function login(){const v=random(128),d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const c=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',v);const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:c});location.href='https://accounts.spotify.com/authorize?'+p}
async function exchange(code){const p=new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p});const d=await r.json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);loadCategories()}else showLogin()}
ui.login.onclick=login;document.getElementById('back-btn').onclick=loadCategories;document.getElementById('prev-btn').onclick=()=>control('previous');document.getElementById('next-btn').onclick=()=>control('next');document.getElementById('play-pause-btn').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+localStorage.getItem('access_token')}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}else notice('Kein aktiver Player gefunden.')};
(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);const token=localStorage.getItem('access_token');if(!token)return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token}});if(r.ok)loadCategories();else showLogin()})();setInterval(updatePlayer,5000);
</script>

async function login(){const v=random(128),d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v));const c=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',v);const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:c});location.href='https://accounts.spotify.com/authorize?'+p}
async function exchange(code){const p=new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')});const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:p});const d=await r.json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);loadCategories()}else showLogin()}
ui.login.onclick=login;document.getElementById('back-btn').onclick=loadCategories;document.getElementById('prev-btn').onclick=()=>control('previous');document.getElementById('next-btn').onclick=()=>control('next');document.getElementById('play-pause-btn').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+localStorage.getItem('access_token')}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}else notice('Kein aktiver Player gefunden.')};
(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);const token=localStorage.getItem('access_token');if(!token)return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token}});if(r.ok)loadCategories();else showLogin()})();setInterval(updatePlayer,5000);
</script>

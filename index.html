<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Kinder Player</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box;user-select:none;-webkit-user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif;touch-action:pan-y}body.nav-visible{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-tile,.back-btn{background:#282828;color:#fff;border:1px solid #ffffff26;border-radius:12px;font-weight:bold;cursor:pointer}.category-tile{border:3px solid transparent;padding:12px 18px;font-size:1rem}.category-tile.active{border-color:#1db954;background:#333;transform:scale(1.03)}.grid-container{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border-radius:12px;padding:10px;text-align:center;cursor:pointer;border:3px solid transparent;transition:.2s}.tile.active{border-color:#1db954;background:#333;transform:scale(1.03);box-shadow:0 4px 15px #1db95466}.tile img{width:100%;border-radius:8px;aspect-ratio:1;object-fit:cover;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:block;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.loading{text-align:center;color:#888;font-size:1.2rem;margin:40px 0}.player-controls{display:none;position:fixed;left:50%;bottom:15px;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:100;background:#181818f2;backdrop-filter:blur(8px);padding:10px 20px;border-radius:30px;box-shadow:0 4px 16px #0008}.player-controls-inner{display:flex;align-items:center;justify-content:center;gap:20px}.player-button{background:none;border:0;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center}.player-button.primary{background:#1db954;width:48px;height:48px;border-radius:50%}.now-playing{text-align:center;color:#e5e5e5;font-size:.85rem;font-weight:600;min-height:1.2em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:6px}.nav-bar{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:101;width:max-content}.back-btn{padding:10px 22px;font-size:.95rem;display:flex;align-items:center;gap:8px}.empty-state{text-align:center;grid-column:1/-1}.notice{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#f44;color:#fff;padding:12px 24px;border-radius:20px;display:none;z-index:200}@media(max-width:480px){body{padding:15px 15px 125px}body.nav-visible{padding-top:65px}h1{font-size:1.5rem}.category-tile{padding:10px 12px;font-size:.9rem}.player-controls{bottom:10px}.nav-bar{top:10px;width:calc(100% - 30px)}.back-btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<h1 id="page-title">KinderPlayer</h1>
<button id="login-btn" class="btn-login" type="button" style="display:none">Einmalig bei Spotify anmelden</button>
<div id="category-bar" class="category-bar" style="display:none"></div>
<div id="loading" class="loading" style="display:none"></div>
<div id="kachel-grid" class="grid-container"></div>
<div id="player-controls" class="player-controls"><div class="player-controls-inner">
<button id="prev-btn" class="player-button" aria-label="Vorheriger Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button>
<button id="play-pause-btn" class="player-button primary" aria-label="Abspielen/Pausieren"><svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button>
<button id="next-btn" class="player-button" aria-label="Nächster Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button>
</div><div id="now-playing" class="now-playing">Kein Titel aktiv</div></div>
<div id="nav-bar" class="nav-bar"><button id="back-btn" class="back-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l8 8-8 8 1.41-1.41L15.83 13H20v-2z"/></svg><span>Zurück zur Übersicht</span></button></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45';
const REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/';
const CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];
const ui={login:document.getElementById('login-btn'),loading:document.getElementById('loading'),grid:document.getElementById('kachel-grid'),title:document.getElementById('page-title'),categories:document.getElementById('category-bar'),controls:document.getElementById('player-controls'),nav:document.getElementById('nav-bar'),now:document.getElementById('now-playing'),play:document.getElementById('play-icon'),pause:document.getElementById('pause-icon')};
let playlists=[],selectedCategory=null,playerRequest=0;
const accessToken=()=>localStorage.getItem('access_token');
function loading(text){ui.loading.textContent=text||'';ui.loading.style.display=text?'block':'none'}
function setNavigation(visible){ui.nav.style.display=visible?'block':'none';document.body.classList.toggle('nav-visible',visible)}
function showLogin(){loading('');ui.login.style.display='block';ui.categories.style.display='none';ui.grid.innerHTML='';ui.controls.style.display='none';setNavigation(false)}
async function api(path,options={}){const response=await fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+accessToken(),...(options.headers||{})}});if(response.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Nicht autorisiert')}return response}
function makeTile(title,image,onClick,id,isPodcast=false){const tile=document.createElement('div');tile.className='tile';if(id)tile.dataset.trackId=id;tile.onclick=()=>onClick(false);const imageEl=document.createElement('img');imageEl.src=image||'';imageEl.alt='';const titleEl=document.createElement('div');titleEl.className='tile-title';titleEl.textContent=title;tile.append(imageEl,titleEl);if(isPodcast){const restart=document.createElement('button');restart.className='restart-btn';restart.type='button';restart.textContent='↺ Von Anfang an';restart.onclick=e=>{e.stopPropagation();onClick(true)};tile.appendChild(restart)}return tile}
function renderCategories(){ui.categories.innerHTML='';CATEGORIES.forEach(category=>{const button=document.createElement('button');button.className='category-tile'+(selectedCategory===category.key?' active':'');button.type='button';button.textContent=category.label;button.setAttribute('aria-pressed',selectedCategory===category.key);button.onclick=()=>{selectedCategory=selectedCategory===category.key?null:category.key;renderCategories();renderPlaylists()};ui.categories.appendChild(button)});ui.categories.style.display='flex'}
function renderPlaylists(){ui.grid.innerHTML='';const category=CATEGORIES.find(c=>c.key===selectedCategory);const visible=category?playlists.filter(p=>p.name.startsWith(category.prefix)):playlists;if(!visible.length){ui.grid.innerHTML='<p class="empty-state">Keine Playlists gefunden.</p>';loading('');return}visible.forEach(playlist=>{const prefix=CATEGORIES.find(c=>playlist.name.startsWith(c.prefix));const title=playlist.name.replace(prefix?prefix.prefix:'','').trim();ui.grid.appendChild(makeTile(title,playlist.images?.[0]?.url,()=>loadPlaylist(playlist.id,title),playlist.id))});loading('');updatePlayer()}
async function loadOverview(){loading('Lade Playlists...');ui.login.style.display='none';setNavigation(false);ui.title.textContent='KinderPlayer';ui.categories.style.display='flex';selectedCategory=null;try{const response=await api('/me/playlists?limit=50');const data=await response.json();playlists=(data.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(error){console.error(error);loading('Fehler beim Laden der Playlists.')}}
function getEntry(item){return item?.track||item?.item||item?.episode||null}
async function findShowId(items){for(const item of items){const episode=getEntry(item);if(!episode)continue;if(episode.show?.id)return episode.show.id;const episodeId=episode.id||episode.uri?.split(':')[2];if(episode.type==='episode'&&episodeId){const response=await api('/episodes/'+episodeId);if(response.ok){const data=await response.json();if(data.show?.id)return data.show.id}}}return null}
async function loadPlaylist(id,title){loading('Lade Inhalte...');ui.categories.style.display='none';setNavigation(true);ui.grid.innerHTML='';ui.title.textContent=title;try{const response=await api(`/playlists/${id}/items?limit=100`);if(!response.ok)throw Error('Playlist konnte nicht geladen werden');const data=await response.json();const items=data.items||[];if(!items.length){loading('Keine Inhalte gefunden.');return}if(selectedCategory==='podcast'){const showId=await findShowId(items);if(showId){await loadEpisodes(showId,title);return}}loading('');items.forEach(item=>{const entry=getEntry(item);if(entry)ui.grid.appendChild(makeTile(entry.name,entry.album?.images?.[0]?.url||entry.images?.[0]?.url,()=>playTrack(id,entry),entry.id))});ui.controls.style.display='block';updatePlayer()}catch(error){console.error(error);loading('Fehler beim Laden der Inhalte.')}}
async function loadEpisodes(showId,title){loading('Lade Podcast-Folgen...');try{const response=await api(`/shows/${showId}/episodes?limit=50`);if(!response.ok)throw Error('Podcast-Folgen konnten nicht geladen werden');const data=await response.json();ui.grid.innerHTML='';if(!data.items?.length){loading('Keine Folgen gefunden.');return}data.items.forEach(episode=>ui.grid.appendChild(makeTile(episode.name,episode.images?.[0]?.url||'',restart=>playEpisode(episode,restart),episode.id,true)));loading('');ui.controls.style.display='block';updatePlayer()}catch(error){console.error(error);loading('Fehler beim Laden der Podcast-Folgen.')}}
async function playTrack(playlistId,track){const response=await fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+accessToken(),'Content-Type':'application/json'},body:JSON.stringify({context_uri:`spotify:playlist:${playlistId}`,offset:{uri:`spotify:track:${track.id}`}})});if(response.ok){ui.now.textContent=track.name;setTimeout(updatePlayer,500)}else if(response.status===404)notice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}
async function playEpisode(episode,restart){const body={uris:[`spotify:episode:${episode.id`]};if(restart)body.position_ms=0;const response=await fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+accessToken(),'Content-Type':'application/json'},body:JSON.stringify(body)});if(response.ok){ui.now.textContent=episode.name;setTimeout(updatePlayer,500)}else if(response.status===404)notice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}
function notice(text){let element=document.getElementById('notice');if(!element){element=document.createElement('div');element.id='notice';element.className='notice';document.body.appendChild(element)}element.textContent=text;element.style.display='block'}
function markActive(id){document.querySelectorAll('.tile').forEach(tile=>tile.classList.toggle('active',tile.dataset.trackId===id))}
async function updatePlayer(){const request=++playerRequest;try{const response=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+accessToken()}});if(request!==playerRequest)return;if(response.status===200){const data=await response.json();ui.controls.style.display='block';ui.play.style.display=data.is_playing?'none':'block';ui.pause.style.display=data.is_playing?'block':'none';if(data.item){markActive(data.item.id);ui.now.textContent=data.item.name}}else if(response.status===204){ui.play.style.display='block';ui.pause.style.display='none';markActive(null);ui.now.textContent='Kein Titel aktiv'}}catch(error){console.error(error)}}
async function control(action){await fetch('https://api.spotify.com/v1/me/player/'+action,{method:action==='next'||action==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+accessToken()}});setTimeout(updatePlayer,500)}
function randomString(length){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';const values=new Uint8Array(length);crypto.getRandomValues(values);return Array.from(values,v=>chars[v%chars.length]).join('')}
async function login(){const verifier=randomString(128);const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));const challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',verifier);const params=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative user-library-read user-library-modify',code_challenge_method:'S256',code_challenge:challenge});location.href='https://accounts.spotify.com/authorize?'+params}
async function exchange(code){const response=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})});const data=await response.json();if(data.access_token){localStorage.setItem('access_token',data.access_token);history.replaceState({},document.title,location.pathname);loadOverview()}else showLogin()}
document.getElementById('login-btn').onclick=login;document.getElementById('back-btn').onclick=loadOverview;document.getElementById('prev-btn').onclick=()=>control('previous');document.getElementById('next-btn').onclick=()=>control('next');document.getElementById('play-pause-btn').onclick=async()=>{const response=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+accessToken()}});if(response.status===200){const data=await response.json();control(data.is_playing?'pause':'play')}else notice('Kein aktiver Player gefunden.')};
(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!accessToken())return showLogin();const response=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+accessToken()}});if(response.ok)loadOverview();else showLogin()})();setInterval(updatePlayer,5000);
</script>
</body>
</html>

    }<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kinder Player</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { 
      box-sizing: border-box; 
      user-select: none; 
      -webkit-user-select: none; 
    }
    body { 
      margin: 0; 
      padding: 20px; 
      background-color: #121212; 
      color: #fff; 
      font-family: sans-serif; 
      
      /* Verhindert Wisch-Gesten für Vor/Zurück und Pull-to-Refresh */
      overscroll-behavior: none;
      touch-action: pan-y;
    }
    h1 { 
      text-align: center; 
      color: #1db954; 
      font-size: 1.8rem; 
      margin-bottom: 20px; 
    }
    .btn-login { 
      display: block; 
      margin: 50px auto; 
      padding: 15px 30px; 
      background: #1db954; 
      color: white; 
      border: none; 
      border-radius: 25px; 
      font-size: 1.2rem; 
      font-weight: bold; 
      cursor: pointer; 
    }
    .grid-container { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); 
      gap: 15px; 
    }
    .tile { 
      background: #282828; 
      border-radius: 12px; 
      padding: 10px; 
      text-align: center; 
      cursor: pointer; 
      border: 3px solid transparent;
      transition: all 0.2s ease;
    }
    .tile.active {
      border-color: #1db954;
      background: #333333;
      transform: scale(1.03);
      box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
    }
    .tile img { 
      width: 100%; 
      border-radius: 8px; 
      aspect-ratio: 1/1; 
      object-fit: cover; 
    }
    .tile-title { 
      margin-top: 8px; 
      font-size: 0.95rem; 
      font-weight: bold; 
      display: -webkit-box; 
      -webkit-line-clamp: 2; 
      -webkit-box-orient: vertical; 
      overflow: hidden; 
    }
    .loading { 
      text-align: center; 
      color: #888; 
      font-size: 1.2rem; 
      margin-top: 40px; 
    }
  </style>
</head>
<body>
<body>

  <!-- Fixierte Player-Controls ganz oben -->
  <div id="player-controls" style="display: none; position: sticky; top: 10px; z-index: 100; background: rgba(24, 24, 24, 0.95); backdrop-filter: blur(8px); padding: 10px 20px; border-radius: 30px; margin: 0 auto 20px auto; max-width: 280px; text-align: center; box-shadow: 0 6px 16px rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.1);">
    <div style="display: flex; align-items: center; justify-content: center; gap: 20px;">
      <button id="prev-btn" style="background: none; border: none; color: white; cursor: pointer; padding: 5px; display: flex; align-items: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
      </button>
      
      <button id="play-pause-btn" style="background: #1DB954; border: none; color: white; width: 48px; height: 48px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; padding: 0;">
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>

      <button id="next-btn" style="background: none; border: none; color: white; cursor: pointer; padding: 5px; display: flex; align-items: center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </button>
    </div>
  </div>

  <!-- Navigation für Unterseiten (Zurück-Button) -->
  <div id="nav-bar" style="display: none; text-align: center; margin: 15px 0 25px 0;">
    <button id="back-to-main-btn" style="background: #282828; color: white; border: 1px solid rgba(255,255,255,0.2); padding: 12px 24px; border-radius: 25px; font-size: 1rem; font-weight: bold; cursor: pointer; display: inline-flex; align-items: center; gap: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
      ⬅️ Zurück zur Übersicht
    </button>
  </div>

  <h1 id="page-title" style="text-align: center; font-size: 1.5rem; margin-bottom: 20px;">KinderPlayer</h1>

  <button id="login-btn" class="btn-login" style="display:none;" onclick="redirectToSpotify()">Einmalig bei Spotify anmelden</button>
  <div id="loading" class="loading">Prüfe Verbindung...</div>
  
  <!-- Kachel-Grid -->
  <div class="grid-container" id="kachel-grid"></div>

  <div id="app-version" style="text-align: center; color: #555; font-size: 0.8rem; margin: 30px 0 10px 0;"></div>
  <script>

    // Erzwingt das Neuladen beim Start, um immer den neuesten Code von GitHub zu haben
    if (performance.navigation.type === 1) {
      // Seite wurde manuell neu geladen
    } else {
      // Bei jedem regulären App-Start frische Daten anfordern
      fetch(window.location.href, { cache: 'reload' });
    }
    
    const CLIENT_ID = 'a6c7e7f802d043c29cce919b9e0c7f45';
    const PLAYLIST_ID = '5SwgtF75qBUzNDSVKahajV';
    const REDIRECT_URI = 'https://chr-wa.github.io/KinderPlayer/';

    function generateRandomString(length) {
      const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
      const values = new Uint8Array(length);
      window.crypto.getRandomValues(values);
      return Array.from(values).map(x => possible[x % possible.length]).join('');
    }

    async function generateCodeChallenge(codeVerifier) {
      const encoder = new TextEncoder();
      const data = encoder.encode(codeVerifier);
      const digest = await window.crypto.subtle.digest('SHA-256', data);
      return btoa(String.fromCharCode(...new Uint8Array(digest)))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
    }

    async function redirectToSpotify() {
      const verifier = generateRandomString(128);
      const challenge = await generateCodeChallenge(verifier);
      
      localStorage.setItem("pkce_verifier", verifier);

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        response_type: "code",
        redirect_uri: REDIRECT_URI,
        scope: "user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative",
        code_challenge_method: "S256",
        code_challenge: challenge
      });

      document.location = `https://accounts.spotify.com/authorize?${params.toString()}`;
    }

    async function getAccessToken(code) {
      const verifier = localStorage.getItem("pkce_verifier");
      
      if (!verifier) {
        console.error("Kein PKCE Verifier gefunden.");
        showLogin();
        return;
      }

      const params = new URLSearchParams({
        client_id: CLIENT_ID,
        grant_type: "authorization_code",
        code: code,
        redirect_uri: REDIRECT_URI,
        code_verifier: verifier
      });

      try {
        const response = await fetch("https://accounts.spotify.com/api/token", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: params
        });

        const data = await response.json();
        
        if (data.access_token) {
          localStorage.setItem("access_token", data.access_token);
          if (data.refresh_token) {
            localStorage.setItem("refresh_token", data.refresh_token);
          }
          
          window.history.replaceState({}, document.title, window.location.pathname);
loadCategories(data.access_token);
        } else {
          console.error("Spotify Fehler-Details:", data);
          document.getElementById('loading').innerText = "Fehler: " + (data.error_description || "Token abgelehnt");
        }
      } catch (err) {
        console.error("Fetch Error:", err);
        document.getElementById('loading').innerText = "Netzwerkfehler beim Token-Tausch.";
      }
    }

const PREFIX = "[KID]"; // Nach diesem Präfix in Spotify-Playlists suchen

    // Hauptübersicht: Alle Playlists mit Präfix "[KID]" abrufen und als Ordner anzeigen
    async function loadCategories(token) {
      document.getElementById('loading').innerText = "Lade Übersichten...";
      document.getElementById('loading').style.display = 'block';
      document.getElementById('login-btn').style.display = 'none';
      document.getElementById('nav-bar').style.display = 'none';
      document.getElementById('page-title').innerText = "KinderPlayer";

      const grid = document.getElementById('kachel-grid');
      grid.innerHTML = '';

      try {
        const res = await fetch("https://api.spotify.com/v1/me/playlists?limit=50", {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (res.status === 401) {
          localStorage.removeItem("access_token");
          showLogin();
          return;
        }

        const data = await res.json();
        document.getElementById('loading').style.display = 'none';

        const playlists = data.items || [];
        
        // Nur Playlists filtern, die mit [KID] beginnen
        const kidPlaylists = playlists.filter(pl => pl.name && pl.name.startsWith(PREFIX));

        if (kidPlaylists.length === 0) {
          grid.innerHTML = `<p style="text-align: center; grid-column: 1/-1;">Keine Playlists mit <b>${PREFIX}</b> im Namen in Spotify gefunden!</p>`;
          return;
        }

        kidPlaylists.forEach(pl => {
          // "[KID] " aus dem angezeigten Titel abschneiden
          const cleanTitle = pl.name.replace(PREFIX, '').trim();
          const imageUrl = pl.images && pl.images.length > 0 ? pl.images[0].url : '';

          const tile = document.createElement('div');
          tile.className = 'tile';

          tile.onclick = () => {
            loadPlaylistTracks(token, pl.id, cleanTitle);
          };

          tile.innerHTML = `
            <img src="${imageUrl}" alt="${cleanTitle}">
            <div class="tile-title">${cleanTitle}</div>
          `;
          grid.appendChild(tile);
        });

        updateCurrentlyPlaying();

      } catch (err) {
        console.error("Fehler beim Laden der Kategorien:", err);
        document.getElementById('loading').innerText = "Fehler beim Laden der Übersichten.";
      }
    }
    
async function loadPlaylistTracks(token, playlistId, title) {
  document.getElementById('loading').innerText = "Lade Folgen...";
  document.getElementById('loading').style.display = 'block';
  document.getElementById('login-btn').style.display = 'none';
  document.getElementById('kachel-grid').innerHTML = '';

  // Zurück-Button anzeigen & Überschrift anpassen
  document.getElementById('nav-bar').style.display = 'block';
  document.getElementById('page-title').innerText = title;

  try {
    const res = await fetch(`https://api.spotify.com/v1/playlists/${playlistId}/items?limit=100`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });

    if (res.status === 401) {
      localStorage.removeItem("access_token");
      showLogin();
      return;
    }

    if (!res.ok) {
      const errData = await res.json();
      console.error("API Fehler-Details:", errData);
      document.getElementById('loading').innerText = `Spotify Fehler ${res.status}: ${errData.error?.message || 'Zugriff verweigert'}`;
      return;
    }

    const data = await res.json();
    document.getElementById('loading').style.display = 'none';
    document.getElementById('player-controls').style.display = 'block';

    const grid = document.getElementById('kachel-grid');
    grid.innerHTML = '';

    const items = data.items || [];

    if (items.length === 0) {
      document.getElementById('loading').style.display = 'block';
      document.getElementById('loading').innerText = "Keine Titel in dieser Playlist gefunden.";
      return;
    }

    items.forEach(item => {
      const track = item.track || item.item || item.episode;
      if (!track) return;

      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.trackId = track.id;

      tile.onclick = async () => {
        try {
          // Payload mit dynamischer playlistId
          const playPayload = {
            context_uri: `spotify:playlist:${playlistId}`,
            offset: { uri: `spotify:track:${track.id}` }
          };

          let playRes = await fetch("https://api.spotify.com/v1/me/player/play", {
            method: "PUT",
            headers: {
              "Authorization": `Bearer ${token}`,
              "Content-Type": "application/json"
            },
            body: JSON.stringify(playPayload)
          });

          // Fallback: Wenn kein aktiver Player gefunden wurde, erstes Device in Liste suchen
          if (playRes.status === 404) {
            const devicesRes = await fetch("https://api.spotify.com/v1/me/player/devices", {
              headers: { "Authorization": `Bearer ${token}` }
            });

            if (devicesRes.ok) {
              const devicesData = await devicesRes.json();
              const devices = devicesData.devices || [];

              if (devices.length > 0) {
                const targetDeviceId = devices[0].id;

                playRes = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${targetDeviceId}`, {
                  method: "PUT",
                  headers: {
                    "Authorization": `Bearer ${token}`,
                    "Content-Type": "application/json"
                  },
                  body: JSON.stringify(playPayload)
                });
              }
            }
          }

          if (playRes.status === 404) {
            showChildFriendlyNotice("Achtung: Spotify ist auf dem Abspielgerät nicht bereit. Bitte einmal die Spotify-App auf dem Zielgerät öffnen!");
          } else if (!playRes.ok) {
            const err = await playRes.json();
            console.error("Wiedergabefehler:", err);
          } else {
            hideChildFriendlyNotice();
            setTimeout(updateCurrentlyPlaying, 500);
          }

        } catch (e) {
          console.error("Netzwerkfehler bei Play:", e);
        }
      };

      const imageUrl = track.album?.images[0]?.url || track.images?.[0]?.url || '';

      tile.innerHTML = `
        <img src="${imageUrl}" alt="${track.name}">
        <div class="tile-title">${track.name}</div>
      `;
      grid.appendChild(tile);
    });

    updateCurrentlyPlaying();

  } catch (err) {
    console.error("Netzwerkfehler:", err);
    document.getElementById('loading').innerText = "Fehler beim Laden der Tracks.";
  }
}

    function markActiveTile(playingTrackId) {
      const tiles = document.querySelectorAll('.tile');
      tiles.forEach(tile => {
        if (tile.dataset.trackId === playingTrackId) {
          tile.classList.add('active');
        } else {
          tile.classList.remove('active');
        }
      });
    }

    // Erweitere Status-Abfrage für dynamisches Play/Pause Icon
async function updateCurrentlyPlaying() {
  const token = localStorage.getItem("access_token");
  if (!token) return;

  try {
    const res = await fetch("https://api.spotify.com/v1/me/player", {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (res.status === 200) {
      const data = await res.json();
      document.getElementById('player-controls').style.display = 'block';

      // SVG-Icon passend zum Wiedergabestatus einstellen (Play oder Pause)
      setPlayPauseIcon(data.is_playing);

      if (data.item) {
        markActiveTile(data.item.id);
      }
    } else if (res.status === 204) {
      // Wenn aktuell nichts wiedergegeben wird
      setPlayPauseIcon(false);
      markActiveTile(null);
    }
  } catch (e) {
    console.error("Fehler beim Abrufen des Player-Status:", e);
  }
}

    function showChildFriendlyNotice(message) {
      let notice = document.getElementById('player-notice');
      if (!notice) {
        notice = document.createElement('div');
        notice.id = 'player-notice';
        notice.style.cssText = 'position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #ff4d4d; color: white; padding: 12px 24px; border-radius: 20px; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; text-align: center;';
        document.body.appendChild(notice);
      }
      notice.innerText = message;
      notice.style.display = 'block';
    }

    function hideChildFriendlyNotice() {
      const notice = document.getElementById('player-notice');
      if (notice) notice.style.display = 'none';
    }

    function showLogin() {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('login-btn').style.display = 'block';
      document.getElementById('player-controls').style.display = 'none';
    }

    // Player Steuerung Elements & Listener
    const playPauseBtn = document.getElementById('play-pause-btn');
    const prevBtn = document.getElementById('prev-btn');
    const nextBtn = document.getElementById('next-btn');

    // Play / Pause
playPauseBtn.addEventListener('click', async () => {
  const token = localStorage.getItem("access_token");
  if (!token) return;

  try {
    const stateRes = await fetch("https://api.spotify.com/v1/me/player", {
      headers: { "Authorization": `Bearer ${token}` }
    });

    if (stateRes.status === 200) {
      const playerState = await stateRes.json();
      const isCurrentlyPlaying = playerState.is_playing;
      const endpoint = isCurrentlyPlaying ? "pause" : "play";
      
      await fetch(`https://api.spotify.com/v1/me/player/${endpoint}`, {
        method: "PUT",
        headers: { "Authorization": `Bearer ${token}` }
      });

      // Sofortiges optisches Feedback über die SVG-Funktion
      // (Wenn es lief, schalten wir sofort auf Play-Icon, sonst auf Pause-Icon)
      setPlayPauseIcon(!isCurrentlyPlaying);
      
      // Status nach kurzer Zeit von Spotify bestätigen lassen
      setTimeout(updateCurrentlyPlaying, 500);

    } else if (stateRes.status === 204 || stateRes.status === 404) {
      showChildFriendlyNotice("Kein aktiver Player gefunden. Bitte erst ein Lied über eine Kachel starten!");
    }
  } catch (e) {
    console.error("Fehler beim Steuern der Wiedergabe:", e);
  }
});
    // Zurück
    prevBtn.addEventListener('click', async () => {
      const token = localStorage.getItem("access_token");
      if (!token) return;

      try {
        await fetch("https://api.spotify.com/v1/me/player/previous", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });
        setTimeout(updateCurrentlyPlaying, 500);
      } catch (e) {
        console.error("Fehler beim Zurückspringen:", e);
      }
    });

    // Weiter
    nextBtn.addEventListener('click', async () => {
      const token = localStorage.getItem("access_token");
      if (!token) return;

      try {
        await fetch("https://api.spotify.com/v1/me/player/next", {
          method: "POST",
          headers: { "Authorization": `Bearer ${token}` }
        });
        setTimeout(updateCurrentlyPlaying, 500);
      } catch (e) {
        console.error("Fehler beim Vorwärtsspringen:", e);
      }
    });

    // App Initialisierung
    const args = new URLSearchParams(window.location.search);
    const code = args.get("code");
    const storedToken = localStorage.getItem("access_token");

    if (code) {
  getAccessToken(code);
} else if (storedToken) {
  loadCategories(storedToken);
} else {
  showLogin();
}

    // Prüfe alle 5 Sekunden automatisch den aktuell gespielten Titel
    setInterval(updateCurrentlyPlaying, 5000);

    // Verhindert das Landen auf der leeren/dunklen Seite im fixierten Modus
    function preventAppCloseInPinning() {
      window.history.pushState({ page: 'home' }, '', window.location.href);

      window.addEventListener('popstate', function (event) {
        window.history.pushState({ page: 'home' }, '', window.location.href);
      });
    }

function setPlayPauseIcon(isPlaying) {
  const playIcon = document.getElementById('play-icon');
  const pauseIcon = document.getElementById('pause-icon');
  
  if (playIcon && pauseIcon) {
    playIcon.style.display = isPlaying ? 'none' : 'block';
    pauseIcon.style.display = isPlaying ? 'block' : 'none';
  }
}

// Zurück zur Übersicht-Button Listener
    document.getElementById('back-to-main-btn').addEventListener('click', () => {
      const token = localStorage.getItem("access_token");
      if (token) loadCategories(token);
    });
    
    preventAppCloseInPinning();

    // Zeitstempel der letzten Dateiänderung auf dem Server anzeigen
    function renderLastModified() {
      const versionEl = document.getElementById('app-version');
      if (versionEl) {
        const lastModified = new Date(document.lastModified);
        const formattedDate = lastModified.toLocaleString('de-DE', {
          day: '2-digit',
          month: '2-digit',
          year: 'numeric',
          hour: '2-digit',
          minute: '2-digit'
        });

        versionEl.innerText = `Stand: ${formattedDate} Uhr, (c) Christian Waschke`;
      }
    }

    renderLastModified();

  </script>
</body>
</html>

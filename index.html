<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KinderPlayer</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif}body.detail{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-bar.sticky{position:sticky;top:10px;z-index:9;background:#121212;padding:10px 0;border-radius:12px}.category-tile,.back-btn{background:#282828;color:#fff;border:1px solid #ffffff26;border-radius:12px;font-weight:bold;cursor:pointer}.category-tile{border:3px solid transparent;padding:12px 18px}.category-tile.active{border-color:#1db954;background:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.tile.active{border-color:#1db954!important;background:#333;transform:scale(1.03);box-shadow:0 4px 15px rgba(29,185,84,.4)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:block;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.loading{display:none;text-align:center;color:#888;font-size:1.1rem;margin:35px 0}.nav{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10}.back-btn{padding:10px 22px;border-radius:25px;display:inline-flex;align-items:center;gap:8px}.controls{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:20;background:#181818f2;padding:10px 20px;border-radius:30px;text-align:center}.buttons{display:flex;justify-content:center;gap:20px}.player-btn{background:none;border:0;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center}.player-btn.main{background:#1db954;border-radius:50%;width:48px;height:48px}.now{text-align:center;margin-top:6px;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;grid-column:1/-1}@media(max-width:480px){body{padding:15px 15px 125px}body.detail{padding-top:65px}.category-tile{padding:10px 12px;font-size:.9rem}.nav{top:10px;width:calc(100% - 30px)}.back-btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<h1 id="title">KinderPlayer</h1><button id="login" class="btn-login" style="display:none" type="button">Einmalig bei Spotify anmelden</button><div id="categories" class="category-bar" style="display:none"></div><div id="loading" class="loading"></div><div id="grid" class="grid"></div>
<div id="nav" class="nav"><button id="back" class="back-btn" type="button">← <span>Zurück zur Übersicht</span></button></div>
<div id="controls" class="controls"><div class="buttons"><button id="previous" class="player-btn" aria-label="Vorheriger Titel">⏮</button><button id="toggle" class="player-btn main" aria-label="Abspielen/Pausieren"><span id="play">▶</span><span id="pause" style="display:none">Ⅱ</span></button><button id="next" class="player-btn" aria-label="Nächster Titel">⏭</button></div><div id="now" class="now">Kein Titel aktiv</div></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45',REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/',CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}],$=id=>document.getElementById(id),token=()=>localStorage.getItem('access_token');let playlists=[],category=null,loadId=0,lastActive=null;
function loading(text){$('loading').textContent=text||'';$('loading').style.display=text?'block':'none'}function detail(v){$('nav').style.display=v?'block':'none';document.body.classList.toggle('detail',v);$('categories').classList.toggle('sticky',!v)}function showLogin(){loading('');$('login').style.display='block';$('categories').style.display='none';$('grid').innerHTML='';$('controls').style.display='none';detail(false)}
async function api(path,opt={}){const r=await fetch('https://api.spotify.com/v1'+path,{...opt,headers:{Authorization:'Bearer '+token(),...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Nicht autorisiert')}return r}
function tile(name,image,action,id,podcast=false){const t=document.createElement('div');t.className='tile';t.dataset.id=String(id||'');t.onclick=()=>action(false);t.innerHTML='<img src="'+(image||'')+'" alt=""><div class="tile-title"></div>';t.querySelector('.tile-title').textContent=name;if(podcast){const b=document.createElement('button');b.className='restart-btn';b.type='button';b.textContent='↺ Von Anfang an';b.onclick=e=>{e.stopPropagation();action(true)};t.append(b)}return t}
function renderCategories(){const box=$('categories');box.innerHTML='';CATEGORIES.forEach(c=>{const b=document.createElement('button');b.className='category-tile'+(category===c.key?' active':'');b.textContent=c.label;b.onclick=()=>{category=category===c.key?null:c.key;renderCategories();renderPlaylists()};box.append(b)});box.style.display='flex'}function renderPlaylists(){const box=$('grid');box.innerHTML='';const c=CATEGORIES.find(x=>x.key===category),list=c?playlists.filter(p=>p.name.startsWith(c.prefix)):playlists;list.forEach(p=>{const x=CATEGORIES.find(c=>p.name.startsWith(c.prefix));box.append(tile(p.name.replace(x?.prefix||'','').trim(),p.images?.[0]?.url,()=>loadPlaylist(p.id,p.name,x?.key==='podcast'),p.id))});loading('');updatePlayer()}
async function overview(){loading('Lade Playlists...');$('login').style.display='none';detail(false);$('title').textContent='KinderPlayer';category=null;try{const d=await(await api('/me/playlists?limit=50')).json();playlists=(d.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(e){console.error(e);loading('Fehler beim Laden der Playlists.')}}
function entry(x){return x?.track||x?.item||x?.episode||null}async function showId(items){for(const raw of items){const e=entry(raw),uri=e?.uri||raw?.uri||'',direct=e?.show?.id||raw?.show?.id;if(direct)return direct;const m=String(uri).match(/spotify:show:([^:]+)/);if(m)return m[1];const id=e?.id||raw?.id;if(id&&(e?.type==='episode'||uri.startsWith('spotify:episode:'))){const r=await api('/episodes/'+id);if(r.ok){const d=await r.json();if(d.show?.id)return d.show.id}}}return null}
async function loadPlaylist(id,name,isPodcast=false){const current=++loadId;loading('Lade Inhalte...');$('categories').style.display='none';detail(true);$('grid').innerHTML='';$('title').textContent=name;try{const d=await(await api(`/playlists/${id}/items?limit=100`)).json(),items=d.items||[];if(current!==loadId)return;if(!items.length){loading('Keine Inhalte gefunden.');return}if(isPodcast||category==='podcast'){const sid=await showId(items);if(current!==loadId)return;if(sid){await loadEpisodes(sid,current);return}}loading('');items.forEach(x=>{const e=entry(x);if(e)$('grid').append(tile(e.name,e.album?.images?.[0]?.url||e.images?.[0]?.url,()=>playTrack(id,e),e.id))});$('controls').style.display='block';updatePlayer()}catch(e){if(current!==loadId)return;console.error(e);if(!$('grid').children.length)loading('Fehler beim Laden der Inhalte.')}}
async function loadEpisodes(sid,parent){const current=parent||++loadId;loading('Lade Podcast-Folgen...');try{const r=await api(`/shows/${sid}/episodes?limit=50`);if(current!==loadId)return;if(!r.ok)throw Error('episodes');const d=await r.json(),episodes=d.items||[];if(current!==loadId)return;if(!episodes.length){loading('Keine Folgen gefunden.');return}$('grid').innerHTML='';episodes.forEach(e=>$('grid').append(tile(e.name,e.images?.[0]?.url, restart=>playEpisode(e,restart),e.id,true)));loading('');$('controls').style.display='block';updatePlayer()}catch(e){if(current!==loadId)return;console.error(e);if(!$('grid').children.length)loading('Fehler beim Laden der Podcast-Folgen.')}}
async function play(body){return fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(body)})}async function playTrack(pid,t){const r=await play({context_uri:`spotify:playlist:${pid}`,offset:{uri:`spotify:track:${t.id}`}});if(r.ok){lastActive={id:String(t.id),title:t.name};mark(t.id);$('now').textContent=t.name;setTimeout(updatePlayer,500)}}async function playEpisode(e,restart){const b={uris:[`spotify:episode:${e.id}`]};if(restart)b.position_ms=0;const r=await play(b);if(r.ok){lastActive={id:String(e.id),title:e.name};mark(e.id);$('now').textContent=e.name;setTimeout(updatePlayer,500)}}function mark(id){const x=id==null?null:String(id);document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('active',x!==null&&t.dataset.id===x))}
async function updatePlayer(){try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();$('controls').style.display='block';$('play').style.display=d.is_playing?'none':'inline';$('pause').style.display=d.is_playing?'inline':'none';const i=d.item,id=i?.id||i?.uri?.split(':').pop();if(id){lastActive={id:String(id),title:i.name||lastActive?.title};$('now').textContent=lastActive.title;mark(id)}else if(lastActive){$('now').textContent=lastActive.title;mark(lastActive.id)}}else if(!lastActive){mark(null);$('now').textContent='Kein Titel aktiv'}}catch(e){if(lastActive){$('now').textContent=lastActive.title;mark(lastActive.id)}}}
async function control(a){await fetch('https://api.spotify.com/v1/me/player/'+a,{method:a==='next'||a==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+token()}});setTimeout(updatePlayer,500)}function random(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~'[x%66]).join('')}async function login(){const v=random(128),d=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(v)),c=btoa(String.fromCharCode(...new Uint8Array(d))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',v);location.href='https://accounts.spotify.com/authorize?'+new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:c})}async function exchange(code){const d=await(await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})})).json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);overview()}else showLogin()}
$('login').onclick=login;$('back').onclick=overview;$('previous').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('toggle').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}};(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!token())return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token()}});if(r.ok)overview();else showLogin()})();setInterval(updatePlayer,5000);
</script></body></html>

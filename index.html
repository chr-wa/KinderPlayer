<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KinderPlayer</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif}body.detail{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-tile,.back-btn{background:#282828;color:#fff;border:1px solid #ffffff26;border-radius:12px;font-weight:bold;cursor:pointer}.category-tile{border:3px solid transparent;padding:12px 18px}.category-tile.active{border-color:#1db954;background:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.tile.active{border-color:#1db954!important;background:#333;transform:scale(1.03);box-shadow:0 4px 15px rgba(29,185,84,.4)}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:block;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.loading{display:none;text-align:center;color:#888;font-size:1.1rem;margin:35px 0}.nav{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10}.back-btn{padding:10px 22px;border-radius:25px;display:inline-flex;align-items:center;gap:8px}.controls{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:20;background:#181818f2;padding:10px 20px;border-radius:30px;text-align:center}.buttons{display:flex;justify-content:center;gap:20px}.player-btn{background:none;border:0;color:#fff;cursor:pointer;padding:5px;display:flex;align-items:center;justify-content:center}.player-btn.main{background:#1db954;border-radius:50%;width:48px;height:48px}.player-btn svg{display:block}.now{text-align:center;margin-top:6px;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;grid-column:1/-1}@media(max-width:480px){body{padding:15px 15px 125px}body.detail{padding-top:65px}.category-tile{padding:10px 12px;font-size:.9rem}.nav{top:10px;width:calc(100% - 30px)}.back-btn{width:100%;justify-content:center}}
</style>
</head>
<body>
<h1 id="title">KinderPlayer</h1><button id="login" class="btn-login" style="display:none" type="button">Einmalig bei Spotify anmelden</button><div id="categories" class="category-bar" style="display:none"></div><div id="loading" class="loading" style="display:none"></div><div id="grid" class="grid"></div>
<div id="nav" class="nav"><button id="back" class="back-btn" type="button"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg><span>Zurück zur Übersicht</span></button></div>
<div id="controls" class="controls"><div class="buttons"><button id="previous" class="player-btn" type="button" aria-label="Vorheriger Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg></button><button id="toggle" class="player-btn main" type="button" aria-label="Abspielen/Pausieren"><svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg><svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg></button><button id="next" class="player-btn" type="button" aria-label="Nächster Titel"><svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg></button></div><div id="now" class="now">Kein Titel aktiv</div></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45',REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/',CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];const $=id=>document.getElementById(id),token=()=>localStorage.getItem('access_token');let playlists=[],category=null,playerSequence=0,lastKnownActive={id:null,title:null};function loading(text){const el=$('loading');el.textContent=text||'';el.style.display=text?'block':'none'}function detailMode(value){$('nav').style.display=value?'block':'none';document.body.classList.toggle('detail',value)}function showLogin(){loading('');$('login').style.display='block';$('categories').style.display='none';$('grid').innerHTML='';$('controls').style.display='none';detailMode(false);markActive(null)}async function api(path,options={}){const r=await fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}});if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Spotify-Anmeldung abgelaufen')}return r}function makeTile(name,image,action,id,podcast=false){const t=document.createElement('div');t.className='tile';if(id)t.dataset.id=String(id);t.onclick=()=>action(false);const img=document.createElement('img');img.src=image||'';img.alt='';const label=document.createElement('div');label.className='tile-title';label.textContent=name;t.append(img,label);if(podcast){const b=document.createElement('button');b.className='restart-btn';b.type='button';b.textContent='↺ Von Anfang an';b.onclick=e=>{e.stopPropagation();action(true)};t.appendChild(b)}return t}function renderCategories(){const box=$('categories');box.innerHTML='';CATEGORIES.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='category-tile'+(category===c.key?' active':'');b.textContent=c.label;b.onclick=()=>{category=category===c.key?null:c.key;renderCategories();renderPlaylists()};box.appendChild(b)});box.style.display='flex'}function renderPlaylists(){const box=$('grid');box.innerHTML='';const c=CATEGORIES.find(x=>x.key===category),list=c?playlists.filter(p=>p.name.startsWith(c.prefix)):playlists;if(!list.length){box.innerHTML='<p class="empty">Keine Playlists gefunden.</p>';loading('');return}list.forEach(p=>{const prefix=CATEGORIES.find(x=>p.name.startsWith(x.prefix));const name=p.name.replace(prefix?prefix.prefix:'','').trim();const isPodcast=p.name.startsWith('[KPP]');box.appendChild(makeTile(name,p.images?.[0]?.url,()=>loadPlaylist(p.id,name,isPodcast),p.id))});loading('');updatePlayer()}async function overview(){loading('Lade Playlists...');$('login').style.display='none';detailMode(false);$('title').textContent='KinderPlayer';category=null;try{const r=await api('/me/playlists?limit=50'),d=await r.json();playlists=(d.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(e){console.error(e);loading('Fehler beim Laden der Playlists.')}}function entry(item){return item?.track||item?.item||item?.episode||null}function getItemShowId(item){if(!item)return null;const val=item.show?.id||item.show_id||item.show?.uri?.split(':').pop();if(val)return val;const uri=item.uri||'';const m=String(uri).match(/spotify:show:(.+)/);if(m&&m[1])return m[1];return null}async function findShowId(items){for(const item of items){const entryItem=entry(item);const showId=getItemShowId(entryItem)||getItemShowId(item);if(showId)return showId;const episodeId=entryItem?.id||entryItem?.uri?.split(':').pop()||item?.id||null;if(episodeId&&(entryItem?.type==='episode'||String(entryItem?.uri||'').startsWith('spotify:episode:'))){const r=await api('/episodes/'+episodeId);if(r.ok){const d=await r.json();if(d.show?.id)return d.show.id}}}return null}async function loadPlaylist(id,name,isPodcast=false){loading('Lade Inhalte...');$('categories').style.display='none';detailMode(true);$('grid').innerHTML='';$('title').textContent=name;try{const r=await api(`/playlists/${id}/items?limit=100`);if(!r.ok)throw Error('Playlist konnte nicht geladen werden');const d=await r.json(),items=d.items||[];if(!items.length){loading('Keine Inhalte gefunden.');return}const podcastMode = isPodcast || category === 'podcast';if(podcastMode){const showId=await findShowId(items);if(showId){return loadEpisodes(showId,name);}}loading('');items.forEach(item=>{const e=entry(item);if(!e)return;const image=e.album?.images?.[0]?.url||e.images?.[0]?.url||'';$('grid').appendChild(makeTile(e.name,image,()=>playTrack(id,e),e.id))});$('controls').style.display='block';updatePlayer()}catch(e){console.error(e);loading('Fehler beim Laden der Inhalte.')}}async function loadEpisodes(showId,title){loading('Lade Podcast-Folgen...');try{const r=await api(`/shows/${showId}/episodes?limit=50`);if(!r.ok)throw Error('Podcast-Folgen konnten nicht geladen werden');const d=await r.json();$('grid').innerHTML='';const episodes=d.items||[];if(!episodes.length){loading('Keine Folgen gefunden.');return}episodes.forEach(episode=>$('grid').appendChild(makeTile(episode.name,episode.images?.[0]?.url||'',restart=>playEpisode(episode,restart),episode.id,true)));loading('');$('controls').style.display='block';updatePlayer()}catch(e){console.error(e);loading('Fehler beim Laden der Podcast-Folgen.')}}async function playTrack(playlistId,track){const r=await play({context_uri:`spotify:playlist:${playlistId}`,offset:{uri:`spotify:track:${track.id}`}});if(r.ok){lastKnownActive={id:track.id,title:track.name};markActive(track.id);$('now').textContent=track.name;setTimeout(updatePlayer,500)}else if(r.status===404)alertNotice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}async function playEpisode(episode,restart){const body={uris:[`spotify:episode:${episode.id}`]};if(restart)body.position_ms=0;const r=await play(body);if(r.ok){lastKnownActive={id:episode.id,title:episode.name};markActive(episode.id);$('now').textContent=episode.name;setTimeout(updatePlayer,500)}else if(r.status===404)alertNotice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}function play(body){return fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(body)})}function markActive(id){const normalized=id==null?null:String(id);document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('active',normalized!==null&&t.dataset.id===normalized))}function normalizeActiveItem(item){if(!item)return null;return{id:item.id||item.uri?.split(':').pop()||null,title:item.name||null}}async function updatePlayer(){const n=++playerSequence;try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(n!==playerSequence)return;if(r.status===200){const d=await r.json();$('controls').style.display='block';$('play-icon').style.display=d.is_playing?'none':'block';$('pause-icon').style.display=d.is_playing?'block':'none';const item=normalizeActiveItem(d.item);if(item&&item.id){lastKnownActive={id:item.id,title:item.title||lastKnownActive.title};$('now').textContent=lastKnownActive.title||'Kein Titel aktiv';markActive(item.id);return}if(lastKnownActive.id){$('now').textContent=lastKnownActive.title||'Kein Titel aktiv';markActive(lastKnownActive.id);return}markActive(null);$('now').textContent='Kein Titel aktiv';return}if(r.status===204||!r.ok){if(lastKnownActive.id){$('now').textContent=lastKnownActive.title||'Kein Titel aktiv';markActive(lastKnownActive.id);return}markActive(null);$('now').textContent='Kein Titel aktiv';return}markActive(null);$('now').textContent='Kein Titel aktiv'}catch(e){console.error(e);if(lastKnownActive.id){$('now').textContent=lastKnownActive.title||'Kein Titel aktiv';markActive(lastKnownActive.id);return}markActive(null);$('now').textContent='Kein Titel aktiv'}}async function control(action){await fetch('https://api.spotify.com/v1/me/player/'+action,{method:action==='next'||action==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+token()}});setTimeout(updatePlayer,500)}function alertNotice(text){let n=$('notice');if(!n){n=document.createElement('div');n.id='notice';n.className='notice';document.body.appendChild(n)}n.textContent=text;n.style.display='block'}function randomString(n){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~',a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>chars[x%chars.length]).join('')}async function login(){const verifier=randomString(128),digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier)),challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',verifier);const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:challenge});location.href='https://accounts.spotify.com/authorize?'+p}async function exchange(code){const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})}),d=await r.json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);overview()}else showLogin()}$('login').onclick=login;$('back').onclick=overview;$('previous').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('toggle').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}else alertNotice('Kein aktiver Player gefunden.')};(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!token())return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token()}});if(r.ok)overview();else showLogin()})();setInterval(updatePlayer,5000);
</script>
</body>
</html>

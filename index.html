<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>KinderPlayer</title>
<style>
*{box-sizing:border-box;user-select:none}body{margin:0;padding:20px 20px 125px;background:#121212;color:#fff;font-family:sans-serif}body.detail{padding-top:75px}h1{text-align:center;color:#1db954;font-size:1.8rem;margin:0 0 20px}.btn-login{display:block;margin:50px auto;padding:15px 30px;background:#1db954;color:#fff;border:0;border-radius:25px;font-size:1.2rem;font-weight:bold}.category-bar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}.category-tile,.back-btn{background:#282828;color:#fff;border:1px solid #ffffff26;border-radius:12px;font-weight:bold;cursor:pointer}.category-tile{border:3px solid transparent;padding:12px 18px}.category-tile.active{border-color:#1db954;background:#333}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:15px}.tile{position:relative;background:#282828;border:3px solid transparent;border-radius:12px;padding:10px;text-align:center;cursor:pointer;transition:.2s}.tile.active{border-color:#1db954;background:#333;transform:scale(1.03);box-shadow:0 4px 15px #1db95466}.tile img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:#333}.tile-title{margin-top:8px;font-size:.95rem;font-weight:bold;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.restart-btn{display:block;margin:10px auto 0;padding:7px 10px;background:#444;color:#fff;border:1px solid #777;border-radius:16px;font-size:.75rem;font-weight:bold;cursor:pointer}.loading{text-align:center;color:#888;font-size:1.1rem;margin:35px 0}.nav{display:none;position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:10}.back-btn{padding:10px 22px;border-radius:25px}.controls{display:none;position:fixed;bottom:15px;left:50%;transform:translateX(-50%);width:min(500px,calc(100% - 30px));z-index:20;background:#181818f2;padding:10px 20px;border-radius:30px;text-align:center}.buttons{display:flex;justify-content:center;gap:20px}.player-btn{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer}.player-btn.main{background:#1db954;border-radius:50%;width:48px;height:48px}.now{margin-top:6px;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{text-align:center;grid-column:1/-1}@media(max-width:480px){body{padding:15px 15px 125px}body.detail{padding-top:65px}.category-tile{padding:10px 12px;font-size:.9rem}.nav{top:10px;width:calc(100% - 30px)}.back-btn{width:100%}}
</style>
</head>
<body>
<h1 id="title">KinderPlayer</h1>
<button id="login" class="btn-login" style="display:none" type="button">Einmalig bei Spotify anmelden</button>
<div id="categories" class="category-bar" style="display:none"></div>
<div id="loading" class="loading" style="display:none"></div>
<div id="grid" class="grid"></div>
<div id="nav" class="nav"><button id="back" class="back-btn" type="button">← Zurück zur Übersicht</button></div>
<div id="controls" class="controls"><div class="buttons"><button id="previous" class="player-btn" type="button">⏮</button><button id="toggle" class="player-btn main" type="button">▶</button><button id="next" class="player-btn" type="button">⏭</button></div><div id="now" class="now">Kein Titel aktiv</div></div>
<script>
const CLIENT_ID='a6c7e7f802d043c29cce919b9e0c7f45';
const REDIRECT_URI='https://chr-wa.github.io/KinderPlayer/';
const CATEGORIES=[{key:'music',label:'Musik',prefix:'[KPM]'},{key:'audio',label:'Hörspiele',prefix:'[KPH]'},{key:'podcast',label:'Podcasts',prefix:'[KPP]'}];
const $=id=>document.getElementById(id);const token=()=>localStorage.getItem('access_token');
let playlists=[],category=null,playerSequence=0;
function loading(text){$('loading').textContent=text||'';$('loading').style.display=text?'block':'none'}
function detailMode(value){$('nav').style.display=value?'block':'none';document.body.classList.toggle('detail',value)}
function showLogin(){loading('');$('login').style.display='block';$('categories').style.display='none';$('grid').innerHTML='';$('controls').style.display='none';detailMode(false)}
async function api(path,options={}){const r=await fetch('https://api.spotify.com/v1'+path,{...options,headers:{Authorization:'Bearer '+token(),...(options.headers||{})}});if(r.status===401){localStorage.removeItem('access_token');showLogin();throw Error('Spotify-Anmeldung abgelaufen')}return r}
function makeTile(name,image,action,id,podcast=false){const t=document.createElement('div');t.className='tile';if(id)t.dataset.id=id;t.onclick=()=>action(false);const img=document.createElement('img');img.src=image||'';img.alt='';const label=document.createElement('div');label.className='tile-title';label.textContent=name;t.append(img,label);if(podcast){const b=document.createElement('button');b.className='restart-btn';b.type='button';b.textContent='↺ Von Anfang an';b.onclick=e=>{e.stopPropagation();action(true)};t.appendChild(b)}return t}
function renderCategories(){const box=$('categories');box.innerHTML='';CATEGORIES.forEach(c=>{const b=document.createElement('button');b.type='button';b.className='category-tile'+(category===c.key?' active':'');b.textContent=c.label;b.onclick=()=>{category=category===c.key?null:c.key;renderCategories();renderPlaylists()};box.appendChild(b)});box.style.display='flex'}
function renderPlaylists(){const box=$('grid');box.innerHTML='';const c=CATEGORIES.find(x=>x.key===category);const list=c?playlists.filter(p=>p.name.startsWith(c.prefix)):playlists;if(!list.length){box.innerHTML='<p class="empty">Keine Playlists gefunden.</p>';loading('');return}list.forEach(p=>{const prefix=CATEGORIES.find(x=>p.name.startsWith(x.prefix));const name=p.name.replace(prefix?prefix.prefix:'','').trim();box.appendChild(makeTile(name,p.images?.[0]?.url,()=>loadPlaylist(p.id,name),p.id))});loading('');updatePlayer()}
async function overview(){loading('Lade Playlists...');$('login').style.display='none';detailMode(false);$('title').textContent='KinderPlayer';category=null;try{const r=await api('/me/playlists?limit=50');const d=await r.json();playlists=(d.items||[]).filter(p=>p.name&&CATEGORIES.some(c=>p.name.startsWith(c.prefix)));renderCategories();renderPlaylists()}catch(e){console.error(e);loading('Fehler beim Laden der Playlists.')}}
function entry(item){return item?.track||item?.item||item?.episode||null}
async function findShowId(items){for(const item of items){const e=entry(item);if(!e)continue;if(e.show?.id)return e.show.id;const id=e.id||e.uri?.split(':')[2];if(e.type==='episode'&&id){const r=await api('/episodes/'+id);if(r.ok){const d=await r.json();if(d.show?.id)return d.show.id}}}return null}
async function loadPlaylist(id,name){loading('Lade Inhalte...');$('categories').style.display='none';detailMode(true);$('grid').innerHTML='';$('title').textContent=name;try{const r=await api(`/playlists/${id}/items?limit=100`);if(!r.ok)throw Error('Playlist konnte nicht geladen werden');const d=await r.json();const items=d.items||[];if(!items.length){loading('Keine Inhalte gefunden.');return}if(category==='podcast'){const show=await findShowId(items);if(show){await loadEpisodes(show);return}}loading('');items.forEach(item=>{const e=entry(item);if(e)$('grid').appendChild(makeTile(e.name,e.album?.images?.[0]?.url||e.images?.[0]?.url,()=>playTrack(id,e),e.id))});$('controls').style.display='block';updatePlayer()}catch(e){console.error(e);loading('Fehler beim Laden der Inhalte.')}}
async function loadEpisodes(showId){loading('Lade Podcast-Folgen...');try{const r=await api(`/shows/${showId}/episodes?limit=50`);if(!r.ok)throw Error('Podcast-Folgen konnten nicht geladen werden');const d=await r.json();$('grid').innerHTML='';if(!d.items?.length){loading('Keine Folgen gefunden.');return}d.items.forEach(e=>$('grid').appendChild(makeTile(e.name,e.images?.[0]?.url||'',restart=>playEpisode(e,restart),e.id,true)));loading('');$('controls').style.display='block';updatePlayer()}catch(e){console.error(e);loading('Fehler beim Laden der Podcast-Folgen.')}}
async function playTrack(playlistId,track){const r=await play({context_uri:`spotify:playlist:${playlistId}`,offset:{uri:`spotify:track:${track.id}`}});if(r.ok){$('now').textContent=track.name;setTimeout(updatePlayer,500)}else if(r.status===404)alertNotice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}
async function playEpisode(episode,restart){const body={uris:[`spotify:episode:${episode.id}`]};if(restart)body.position_ms=0;const r=await play(body);if(r.ok){$('now').textContent=episode.name;setTimeout(updatePlayer,500)}else if(r.status===404)alertNotice('Bitte zuerst Spotify auf dem Zielgerät öffnen.')}
function play(body){return fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{Authorization:'Bearer '+token(),'Content-Type':'application/json'},body:JSON.stringify(body)})}
function markActive(id){document.querySelectorAll('.tile').forEach(t=>t.classList.toggle('active',t.dataset.id===id))}
async function updatePlayer(){const n=++playerSequence;try{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(n!==playerSequence)return;if(r.status===200){const d=await r.json();$('controls').style.display='block';$('toggle').textContent=d.is_playing?'Ⅱ':'▶';if(d.item){markActive(d.item.id);$('now').textContent=d.item.name}}else if(r.status===204){markActive(null);$('now').textContent='Kein Titel aktiv'}}catch(e){console.error(e)}}
async function control(action){await fetch('https://api.spotify.com/v1/me/player/'+action,{method:action==='next'||action==='previous'?'POST':'PUT',headers:{Authorization:'Bearer '+token()}});setTimeout(updatePlayer,500)}
function alertNotice(text){let n=$('notice');if(!n){n=document.createElement('div');n.id='notice';n.className='notice';document.body.appendChild(n)}n.textContent=text;n.style.display='block'}
function randomString(n){const chars='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';const a=new Uint8Array(n);crypto.getRandomValues(a);return Array.from(a,x=>chars[x%chars.length]).join('')}
async function login(){const verifier=randomString(128);const digest=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));const challenge=btoa(String.fromCharCode(...new Uint8Array(digest))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');localStorage.setItem('pkce',verifier);const p=new URLSearchParams({client_id:CLIENT_ID,response_type:'code',redirect_uri:REDIRECT_URI,scope:'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',code_challenge_method:'S256',code_challenge:challenge});location.href='https://accounts.spotify.com/authorize?'+p}
async function exchange(code){const r=await fetch('https://accounts.spotify.com/api/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({client_id:CLIENT_ID,grant_type:'authorization_code',code,redirect_uri:REDIRECT_URI,code_verifier:localStorage.getItem('pkce')})});const d=await r.json();if(d.access_token){localStorage.setItem('access_token',d.access_token);history.replaceState({},document.title,location.pathname);overview()}else showLogin()}
$('login').onclick=login;$('back').onclick=overview;$('previous').onclick=()=>control('previous');$('next').onclick=()=>control('next');$('toggle').onclick=async()=>{const r=await fetch('https://api.spotify.com/v1/me/player',{headers:{Authorization:'Bearer '+token()}});if(r.status===200){const d=await r.json();control(d.is_playing?'pause':'play')}else alertNotice('Kein aktiver Player gefunden.')};
(async()=>{const code=new URLSearchParams(location.search).get('code');if(code)return exchange(code);if(!token())return showLogin();const r=await fetch('https://api.spotify.com/v1/me',{headers:{Authorization:'Bearer '+token()}});if(r.ok)overview();else showLogin()})();setInterval(updatePlayer,5000);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Kinder Player</title>
  <link rel="manifest" href="manifest.json" />
  <style>
    :root {
      --bg: #121212;
      --panel: #181818;
      --panel-2: #282828;
      --panel-3: #333333;
      --green: #1db954;
      --green-dark: #1aa34a;
      --text: #ffffff;
      --muted: #888888;
      --danger: #ff4d4d;
      --shadow: rgba(29, 185, 84, 0.4);
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: sans-serif;
      overscroll-behavior: none;
      touch-action: pan-y;
    }

    body {
      padding: 20px;
    }

    h1 {
      text-align: center;
      color: var(--green);
      font-size: 1.8rem;
      margin-bottom: 20px;
    }

    .btn-login {
      display: block;
      margin: 50px auto;
      padding: 15px 30px;
      background: var(--green);
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 1.2rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .btn-login:hover {
      background: var(--green-dark);
      transform: translateY(-1px);
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 15px;
    }

    .tile {
      background: var(--panel-2);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      border: 3px solid transparent;
      transition: all 0.2s ease;
    }

    .tile:hover {
      background: #2d2d2d;
    }

    .tile.active {
      border-color: var(--green);
      background: var(--panel-3);
      transform: scale(1.03);
      box-shadow: 0 4px 15px var(--shadow);
    }

    .tile img {
      width: 100%;
      border-radius: 8px;
      aspect-ratio: 1 / 1;
      object-fit: cover;
      display: block;
      background: #1c1c1c;
    }

    .tile-title {
      margin-top: 8px;
      font-size: 0.95rem;
      font-weight: bold;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-word;
    }

    .loading {
      text-align: center;
      color: var(--muted);
      font-size: 1.2rem;
      margin-top: 40px;
    }

    .player-controls {
      display: none;
      position: sticky;
      top: 10px;
      z-index: 100;
      background: rgba(24, 24, 24, 0.95);
      backdrop-filter: blur(8px);
      padding: 10px 20px;
      border-radius: 30px;
      margin: 0 auto 20px;
      max-width: 500px;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.25);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }

    .player-controls-inner {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 20px;
      width: 100%;
    }

    .player-button {
      background: none;
      border: none;
      color: white;
      cursor: pointer;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    .player-button:hover {
      transform: scale(1.08);
      opacity: 0.9;
    }

    .player-button.primary {
      background: var(--green);
      width: 48px;
      height: 48px;
      border-radius: 50%;
    }

    .now-playing {
      text-align: center;
      color: #e5e5e5;
      font-size: 0.85rem;
      font-weight: 600;
      min-height: 1.2em;
      max-width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      padding: 0 8px;
    }

    .nav-bar {
      display: none;
      text-align: center;
      margin: 15px 0 25px;
    }

    .back-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: var(--panel-2);
      color: white;
      border: 1px solid rgba(255,255,255,0.15);
      padding: 10px 22px;
      border-radius: 25px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
    }

    .app-version {
      text-align: center;
      color: #555;
      font-size: 0.8rem;
      margin: 30px 0 10px;
    }

    .empty-state {
      text-align: center;
      grid-column: 1 / -1;
      color: #ddd;
    }

    .notice {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: white;
      padding: 12px 24px;
      border-radius: 20px;
      font-weight: bold;
      display: none;
      z-index: 200;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      max-width: 90vw;
      text-align: center;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 1.5rem;
      }

      .grid-container {
        gap: 12px;
      }

      .player-controls {
        padding: 10px 12px;
      }

      .player-controls-inner {
        gap: 14px;
      }
    }
  </style>
</head>
<body>
  <div id="player-controls" class="player-controls">
    <div class="player-controls-inner">
      <button id="prev-btn" class="player-button" aria-label="Vorheriger Titel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
        </svg>
      </button>

      <button id="play-pause-btn" class="player-button primary" aria-label="Abspielen/Pausieren">
        <svg id="play-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M8 5v14l11-7z"/>
        </svg>
        <svg id="pause-icon" width="22" height="22" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" style="display:none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
        </svg>
      </button>

      <button id="next-btn" class="player-button" aria-label="Nächster Titel">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
        </svg>
      </button>
    </div>

    <div id="now-playing" class="now-playing">Kein Titel aktiv</div>
  </div>

  <div id="nav-bar" class="nav-bar">
    <button id="back-to-main-btn" class="back-btn" type="button">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      Zurück zur Übersicht
    </button>
  </div>

  <h1 id="page-title">KinderPlayer</h1>

  <button id="login-btn" class="btn-login" type="button" style="display:none;">
    Einmalig bei Spotify anmelden
  </button>

  <div id="loading" class="loading">Prüfe Verbindung...</div>

  <div class="grid-container" id="kachel-grid"></div>

  <div id="app-version" class="app-version"></div>

  <script>
    (function () {
      const CLIENT_ID = 'a6c7e7f802d043c29cce919b9e0c7f45';
      const REDIRECT_URI = 'https://chr-wa.github.io/KinderPlayer/';
      const PREFIX = '[KID]';

      const ui = {
        loginBtn: document.getElementById('login-btn'),
        loading: document.getElementById('loading'),
        grid: document.getElementById('kachel-grid'),
        pageTitle: document.getElementById('page-title'),
        navBar: document.getElementById('nav-bar'),
        playerControls: document.getElementById('player-controls'),
        appVersion: document.getElementById('app-version'),
        playPauseBtn: document.getElementById('play-pause-btn'),
        prevBtn: document.getElementById('prev-btn'),
        nextBtn: document.getElementById('next-btn'),
        backToMainBtn: document.getElementById('back-to-main-btn'),
        playIcon: document.getElementById('play-icon'),
        pauseIcon: document.getElementById('pause-icon'),
        nowPlaying: document.getElementById('now-playing')
      };

      let updateSequence = 0;

      function setLoading(message, visible = true) {
        ui.loading.textContent = message;
        ui.loading.style.display = visible ? 'block' : 'none';
      }

      function setPageTitle(title) {
        ui.pageTitle.textContent = title;
      }

      function setNowPlayingText(title) {
        if (!ui.nowPlaying) return;
        ui.nowPlaying.textContent = title || 'Kein Titel aktiv';
      }

      function showLogin() {
        ui.loading.style.display = 'none';
        ui.loginBtn.style.display = 'block';
        ui.playerControls.style.display = 'none';
        ui.navBar.style.display = 'none';
        setNowPlayingText('Kein Titel aktiv');
      }

      function showNotice(message) {
        let notice = document.getElementById('player-notice');
        if (!notice) {
          notice = document.createElement('div');
          notice.id = 'player-notice';
          notice.className = 'notice';
          document.body.appendChild(notice);
        }
        notice.textContent = message;
        notice.style.display = 'block';
      }

      function hideNotice() {
        const notice = document.getElementById('player-notice');
        if (notice) notice.style.display = 'none';
      }

      function setPlayPauseIcon(isPlaying) {
        if (!ui.playIcon || !ui.pauseIcon) return;
        ui.playIcon.style.display = isPlaying ? 'none' : 'block';
        ui.pauseIcon.style.display = isPlaying ? 'block' : 'none';
      }

      function createTile({ title, imageUrl = '', trackId = null, onClick }) {
        const tile = document.createElement('div');
        tile.className = 'tile';
        if (trackId) tile.dataset.trackId = trackId;

        tile.addEventListener('click', onClick);

        tile.innerHTML = `
          <img src="${imageUrl || ''}" alt="${title}" loading="lazy" decoding="async" />
          <div class="tile-title">${title}</div>
        `;

        return tile;
      }

      function generateRandomString(length) {
        const possible = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-._~';
        const values = new Uint8Array(length);
        window.crypto.getRandomValues(values);
        return Array.from(values, value => possible[value % possible.length]).join('');
      }

      async function generateCodeChallenge(codeVerifier) {
        const encoder = new TextEncoder();
        const data = encoder.encode(codeVerifier);
        const digest = await window.crypto.subtle.digest('SHA-256', data);
        return btoa(String.fromCharCode(...new Uint8Array(digest)))
          .replace(/\+/g, '-')
          .replace(/\//g, '_')
          .replace(/=+$/, '');
      }

      function spotifyFetch(endpoint, options = {}) {
        const token = localStorage.getItem('access_token');

        return fetch(`https://api.spotify.com/v1${endpoint}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${token}`,
            ...(options.headers || {})
          }
        }).then(async (response) => {
          if (response.status === 401) {
            localStorage.removeItem('access_token');
            showLogin();
            throw new Error('Unauthorized');
          }
          return response;
        });
      }

      async function redirectToSpotify() {
        const verifier = generateRandomString(128);
        const challenge = await generateCodeChallenge(verifier);

        localStorage.setItem('pkce_verifier', verifier);

        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          response_type: 'code',
          redirect_uri: REDIRECT_URI,
          scope: 'user-read-playback-state user-modify-playback-state playlist-read-private playlist-read-collaborative',
          code_challenge_method: 'S256',
          code_challenge: challenge
        });

        window.location.href = `https://accounts.spotify.com/authorize?${params.toString()}`;
      }

      async function getAccessToken(code) {
        const verifier = localStorage.getItem('pkce_verifier');

        if (!verifier) {
          console.error('Kein PKCE Verifier gefunden.');
          showLogin();
          return;
        }

        const params = new URLSearchParams({
          client_id: CLIENT_ID,
          grant_type: 'authorization_code',
          code,
          redirect_uri: REDIRECT_URI,
          code_verifier: verifier
        });

        try {
          const response = await fetch('https://accounts.spotify.com/api/token', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/x-www-form-urlencoded'
            },
            body: params
          });

          const data = await response.json();

          if (data.access_token) {
            localStorage.setItem('access_token', data.access_token);

            if (data.refresh_token) {
              localStorage.setItem('refresh_token', data.refresh_token);
            }

            localStorage.removeItem('pkce_verifier');

            window.history.replaceState({}, document.title, window.location.pathname);
            loadCategories(data.access_token);
          } else {
            console.error('Spotify Fehler-Details:', data);
            setLoading(`Fehler: ${data.error_description || 'Token abgelehnt'}`);
          }
        } catch (err) {
          console.error('Fetch Error:', err);
          setLoading('Netzwerkfehler beim Token-Tausch.');
        }
      }

      async function loadCategories(token) {
        setLoading('Lade Übersichten...');
        ui.loginBtn.style.display = 'none';
        ui.navBar.style.display = 'none';
        setPageTitle('KinderPlayer');
        setNowPlayingText('Kein Titel aktiv');

        ui.grid.innerHTML = '';

        try {
          const response = await spotifyFetch('/me/playlists?limit=50', {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });

          const data = await response.json();
          ui.loading.style.display = 'none';

          const playlists = data.items || [];
          const kidPlaylists = playlists.filter(pl => pl.name && pl.name.startsWith(PREFIX));

          if (kidPlaylists.length === 0) {
            ui.grid.innerHTML = `<p class="empty-state">Keine Playlists mit <b>${PREFIX}</b> im Namen in Spotify gefunden!</p>`;
            return;
          }

          kidPlaylists.forEach(pl => {
            const cleanTitle = pl.name.replace(PREFIX, '').trim();
            const imageUrl = pl.images && pl.images.length > 0 ? pl.images[0].url : '';

            const tile = createTile({
              title: cleanTitle,
              imageUrl,
              onClick: () => loadPlaylistTracks(token, pl.id, cleanTitle)
            });

            ui.grid.appendChild(tile);
          });

          updateCurrentlyPlaying();
        } catch (err) {
          console.error('Fehler beim Laden der Kategorien:', err);
          setLoading('Fehler beim Laden der Übersichten.');
        }
      }

      async function loadPlaylistTracks(token, playlistId, title) {
        setLoading('Lade Folgen...');
        ui.loginBtn.style.display = 'none';
        ui.grid.innerHTML = '';
        ui.navBar.style.display = 'block';
        setPageTitle(title);

        try {
          const response = await spotifyFetch(`/playlists/${playlistId}/items?limit=100`);

          if (!response.ok) {
            const errData = await response.json();
            console.error('API Fehler-Details:', errData);
            setLoading(`Spotify Fehler ${response.status}: ${errData.error?.message || 'Zugriff verweigert'}`);
            return;
          }

          const data = await response.json();
          ui.loading.style.display = 'none';
          ui.playerControls.style.display = 'flex';

          ui.grid.innerHTML = '';

          const items = data.items || [];

          if (items.length === 0) {
            ui.loading.style.display = 'block';
            setLoading('Keine Titel in dieser Playlist gefunden.');
            return;
          }

          items.forEach(item => {
            const track = item.track || item.item || item.episode;
            if (!track) return;

            const imageUrl = track.album?.images[0]?.url || track.images?.[0]?.url || '';

            const tile = createTile({
              title: track.name,
              imageUrl,
              trackId: track.id,
              onClick: async () => {
                try {
                  const playPayload = {
                    context_uri: `spotify:playlist:${playlistId}`,
                    offset: { uri: `spotify:track:${track.id}` }
                  };

                  let playRes = await fetch('https://api.spotify.com/v1/me/player/play', {
                    method: 'PUT',
                    headers: {
                      Authorization: `Bearer ${token}`,
                      'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(playPayload)
                  });

                  if (playRes.status === 404) {
                    const devicesRes = await fetch('https://api.spotify.com/v1/me/player/devices', {
                      headers: { Authorization: `Bearer ${token}` }
                    });

                    if (devicesRes.ok) {
                      const devicesData = await devicesRes.json();
                      const devices = devicesData.devices || [];

                      if (devices.length > 0) {
                        const targetDeviceId = devices[0].id;

                        playRes = await fetch(`https://api.spotify.com/v1/me/player/play?device_id=${targetDeviceId}`, {
                          method: 'PUT',
                          headers: {
                            Authorization: `Bearer ${token}`,
                            'Content-Type': 'application/json'
                          },
                          body: JSON.stringify(playPayload)
                        });
                      }
                    }
                  }

                  if (playRes.status === 404) {
                    showNotice('Achtung: Spotify ist auf dem Abspielgerät nicht bereit. Bitte einmal die Spotify-App auf dem Zielgerät öffnen!');
                  } else if (!playRes.ok) {
                    const err = await playRes.json();
                    console.error('Wiedergabefehler:', err);
                  } else {
                    hideNotice();
                    setNowPlayingText(track.name);
                    setTimeout(updateCurrentlyPlaying, 500);
                  }
                } catch (e) {
                  console.error('Netzwerkfehler bei Play:', e);
                }
              }
            });

            ui.grid.appendChild(tile);
          });

          updateCurrentlyPlaying();
        } catch (err) {
          console.error('Netzwerkfehler:', err);
          setLoading('Fehler beim Laden der Tracks.');
        }
      }

      function markActiveTile(playingTrackId) {
        const tiles = document.querySelectorAll('.tile');

        tiles.forEach(tile => {
          if (tile.dataset.trackId === playingTrackId) {
            tile.classList.add('active');
          } else {
            tile.classList.remove('active');
          }
        });
      }

      async function updateCurrentlyPlaying() {
        const token = localStorage.getItem('access_token');
        if (!token) return;

        const currentSequence = ++updateSequence;

        try {
          const response = await fetch('https://api.spotify.com/v1/me/player', {
            headers: {
              Authorization: `Bearer ${token}`
            }
          });

          if (currentSequence !== updateSequence) return;

          if
